  {cat:'Idiomas', q:'¿Qué significa "hello" en español?', opts:['Hola','Adiós','Gracias','Por favor'], a:0, exp:'"Hello" es el saludo más común en inglés.'},
  {cat:'Idiomas', q:'El mandarín es un idioma tonal, donde el tono de una palabra puede cambiar su significado.', opts:['Verdadero','Falso'], a:0, exp:'La misma sílaba pronunciada con distinto tono puede tener significados completamente diferentes.'},
  {cat:'Idiomas', q:'¿Cómo se dice "libro" en inglés?', opts:['Book','Look','Cook','Hook'], a:0, exp:'"Book" es "libro" en inglés.'},
  {cat:'Idiomas', q:'En alemán, todos los sustantivos se escriben con mayúscula inicial.', opts:['Verdadero','Falso'], a:0, exp:'Es una particularidad del alemán: cualquier sustantivo, común o propio, lleva mayúscula.'},
  {cat:'Idiomas', q:'¿Cuál de estas es una lengua germánica?', opts:['Inglés','Español','Italiano','Francés'], a:0, exp:'El inglés pertenece a la familia de lenguas germánicas, junto con el alemán y el neerlandés.'},
  {cat:'Idiomas', q:'La palabra "sushi" proviene del idioma japonés.', opts:['Verdadero','Falso'], a:0, exp:'"Sushi" hace referencia originalmente al arroz avinagrado, no solo al pescado crudo.'},
  {cat:'Idiomas', q:'¿Cómo se dice "buenos días" en inglés?', opts:['Good morning','Good night','Good evening','Goodbye'], a:0, exp:'"Good morning" se usa para saludar durante la mañana.'},
  {cat:'Idiomas', q:'El árabe se escribe de derecha a izquierda.', opts:['Verdadero','Falso'], a:0, exp:'A diferencia del español, el árabe (como el hebreo) se lee y escribe de derecha a izquierda.'},
  // Medicina
  {cat:'Medicina', q:'¿Cuántas cámaras tiene el corazón humano?', opts:['2','4','3','6'], a:1, exp:'Tiene 4 cámaras: dos aurículas y dos ventrículos.'},
  {cat:'Medicina', q:'La aspirina es un medicamento antiinflamatorio y analgésico.', opts:['Verdadero','Falso'], a:0, exp:'Se usa comúnmente para bajar la fiebre, calmar el dolor y reducir la inflamación.'},
  {cat:'Medicina', q:'¿Qué órgano filtra la sangre y produce la orina?', opts:['Riñón','Hígado','Pulmón','Bazo'], a:0, exp:'Los riñones filtran desechos de la sangre y regulan el equilibrio de líquidos del cuerpo.'},
  {cat:'Medicina', q:'La presión arterial normal en un adulto sano ronda los 120/80 mmHg.', opts:['Verdadero','Falso'], a:0, exp:'Ese valor se considera un rango de referencia saludable para un adulto en reposo.'},
  {cat:'Medicina', q:'¿Qué vitamina se obtiene principalmente por exposición al sol?', opts:['Vitamina D','Vitamina C','Vitamina B12','Vitamina K'], a:0, exp:'La piel sintetiza vitamina D cuando se expone a la luz solar.'},
  {cat:'Medicina', q:'Los glóbulos rojos transportan oxígeno por el cuerpo.', opts:['Verdadero','Falso'], a:0, exp:'Gracias a la hemoglobina, los glóbulos rojos llevan oxígeno desde los pulmones a todo el cuerpo.'},
  {cat:'Medicina', q:'¿Cómo se llama el médico especialista en el corazón?', opts:['Cardiólogo','Dermatólogo','Neurólogo','Pediatra'], a:0, exp:'El cardiólogo se especializa en el diagnóstico y tratamiento de enfermedades del corazón.'},
  {cat:'Medicina', q:'La diabetes tipo 1 y tipo 2 tienen exactamente la misma causa.', opts:['Verdadero','Falso'], a:1, exp:'La tipo 1 es autoinmune (el cuerpo no produce insulina); la tipo 2 se relaciona con resistencia a la insulina.'},
  {cat:'Medicina', q:'¿Qué órgano produce la bilis, necesaria para digerir grasas?', opts:['Hígado','Páncreas','Bazo','Estómago'], a:0, exp:'El hígado produce la bilis, que se almacena en la vesícula biliar.'},
  {cat:'Medicina', q:'Una vacuna estimula el sistema inmunológico para defenderse de un patógeno específico.', opts:['Verdadero','Falso'], a:0, exp:'Entrena las defensas del cuerpo para reconocer y combatir un virus o bacteria antes de una infección real.'},
  {cat:'Medicina', q:'¿Cuál es el grupo sanguíneo considerado "donante universal"?', opts:['O negativo','AB positivo','A positivo','B negativo'], a:0, exp:'El grupo O negativo puede donarse a personas de cualquier grupo sanguíneo.'},
  {cat:'Medicina', q:'El sistema nervioso central está formado por el cerebro y la médula espinal.', opts:['Verdadero','Falso'], a:0, exp:'El resto de los nervios del cuerpo forman el sistema nervioso periférico.'},
  {cat:'Medicina', q:'¿Cómo se llama la inflamación del apéndice, que suele requerir cirugía urgente?', opts:['Apendicitis','Gastritis','Faringitis','Bronquitis'], a:0, exp:'Es una de las causas más comunes de cirugía abdominal de urgencia.'},
  {cat:'Medicina', q:'Los antibióticos son efectivos contra infecciones virales como la gripe común.', opts:['Verdadero','Falso'], a:1, exp:'Los antibióticos combaten bacterias, no virus; por eso no sirven contra la gripe o el resfrío.'},
  {cat:'Medicina', q:'¿Qué hueso protege el cerebro?', opts:['Cráneo','Fémur','Húmero','Esternón'], a:0, exp:'El cráneo forma una caja ósea que protege al cerebro de golpes.'},
  {cat:'Medicina', q:'La hipertensión arterial es un factor de riesgo para sufrir un accidente cerebrovascular (ACV).', opts:['Verdadero','Falso'], a:0, exp:'La presión alta sostenida daña los vasos sanguíneos y aumenta el riesgo de ACV.'},
  {cat:'Medicina', q:'¿Cómo se llama el proceso por el cual los pulmones intercambian oxígeno y dióxido de carbono?', opts:['Respiración','Digestión','Circulación','Excreción'], a:0, exp:'En los alvéolos pulmonares se intercambia oxígeno por dióxido de carbono con la sangre.'},
  {cat:'Medicina', q:'El colesterol alto sin control es un factor de riesgo cardiovascular.', opts:['Verdadero','Falso'], a:0, exp:'El exceso de colesterol puede acumularse en las arterias y aumentar el riesgo de infarto.'},
  {cat:'Medicina', q:'¿Qué especialista se ocupa de la salud de los niños?', opts:['Pediatra','Geriatra','Cardiólogo','Traumatólogo'], a:0, exp:'El pediatra atiende la salud de bebés, niños y adolescentes.'},
  {cat:'Medicina', q:'Dormir bien es importante para la recuperación física y la salud mental.', opts:['Verdadero','Falso'], a:0, exp:'Durante el sueño el cuerpo repara tejidos y el cerebro consolida la memoria.'},

  {cat:'Excel', q:'¿Qué símbolo hay que escribir al principio de una celda para indicar que vas a poner una fórmula?', opts:['=','#','@','$'], a:0, exp:'El signo igual le avisa a Excel que lo que sigue es una fórmula, no texto suelto.'},
  {cat:'Excel', q:'¿Cómo se llama la intersección entre una fila y una columna en una planilla?', opts:['Celda','Rango','Hoja','Libro'], a:0, exp:'Cada celda se identifica por su columna y fila, por ejemplo B4.'},
  {cat:'Excel', q:'¿Qué función suma automáticamente un rango de celdas?', opts:['=SUMA()','=TOTAL()','=ADD()','=CONTAR()'], a:0, exp:'Por ejemplo =SUMA(A1:A10) suma todos los valores de esa columna.'},
  {cat:'Excel', q:'¿Qué hace la función PROMEDIO en Excel?', opts:['Calcula el promedio de un rango de números','Cuenta celdas vacías','Ordena una lista','Convierte texto a número'], a:0, exp:'Suma todos los valores del rango y los divide por la cantidad de celdas.'},
  {cat:'Excel', q:'¿Cómo se llama un archivo de Excel?', opts:['Libro','Hoja','Celda','Documento'], a:0, exp:'Un "libro" de Excel puede contener varias "hojas" adentro, como las pestañas de abajo.'},
  {cat:'Excel', q:'¿Qué función te dice cuántas celdas de un rango cumplen una condición?', opts:['CONTAR.SI','SUMA.SI','BUSCARV','SI'], a:0, exp:'CONTAR.SI cuenta, mientras que SUMAR.SI suma los valores que cumplen la condición.'},
  {cat:'Excel', q:'¿Para qué sirve la función BUSCARV (VLOOKUP)?', opts:['Buscar un valor en una tabla y traer un dato relacionado','Sumar una columna entera','Ordenar de la A a la Z','Contar filas vacías'], a:0, exp:'Por ejemplo, buscar un código de producto y traer su precio desde otra tabla.'},
  {cat:'Excel', q:'¿Qué es una "tabla dinámica" en Excel?', opts:['Una herramienta para resumir y analizar grandes cantidades de datos','Un tipo de gráfico circular','Una macro automática','Un tipo de letra'], a:0, exp:'Permite cruzar y resumir miles de filas de datos en pocos clics, sin escribir fórmulas.'},
  {cat:'Excel', q:'¿Qué función usarías para sumar solo las celdas que cumplen una condición?', opts:['SUMAR.SI','CONTAR','PROMEDIO','MAX'], a:0, exp:'Por ejemplo, sumar solo las ventas de un vendedor específico.'},
  {cat:'Excel', q:'En una fórmula, ¿qué significa poner un signo $ antes de la letra y el número de una celda (ej. $A$1)?', opts:['Fija la referencia para que no cambie al copiar la fórmula','Convierte el número en moneda','Borra el contenido de la celda','Multiplica el valor por 100'], a:0, exp:'Se llama "referencia absoluta" y es muy útil al copiar una fórmula a otras celdas.'},
  {cat:'Excel', q:'¿Qué extensión de archivo usan los libros de Excel modernos?', opts:['.xlsx','.docx','.pptx','.pdf'], a:0, exp:'.docx es de Word y .pptx es de PowerPoint.'},
  {cat:'Excel', q:'¿Qué función devuelve el valor más alto de un rango de celdas?', opts:['MAX','TOP','MAYOR.VALOR','ALTO'], a:0, exp:'Su opuesta es MIN, que devuelve el valor más bajo del rango.'},
  {cat:'Excel', q:'¿Qué es un "rango" en Excel?', opts:['Un grupo de celdas seleccionadas juntas','El nombre de una hoja','Un tipo de gráfico','Una fórmula especial'], a:0, exp:'Por ejemplo A1:A10 es un rango de 10 celdas en la columna A.'},
  {cat:'Excel', q:'¿Para qué sirve "Inmovilizar" o "Congelar paneles" en Excel?', opts:['Para mantener visibles encabezados al desplazarte por una planilla grande','Para bloquear el archivo con contraseña','Para que no se pueda editar ninguna celda','Para imprimir en blanco y negro'], a:0, exp:'Muy útil en planillas largas, para no perder de vista los títulos de las columnas.'},
  {cat:'Excel', q:'¿Qué función te permite combinar el texto de varias celdas en una sola?', opts:['CONCATENAR','SUMA','BUSCAR','TEXTO'], a:0, exp:'Por ejemplo, unir "nombre" y "apellido" en una sola celda.'},
  {cat:'Excel', q:'¿Qué es un "filtro" en una tabla de Excel?', opts:['Mostrar solo las filas que cumplen ciertas condiciones','Cambiar el color de fondo de toda la hoja','Ordenar alfabéticamente sin excepción','Borrar duplicados automáticamente'], a:0, exp:'Permite ver, por ejemplo, solo las ventas de un mes puntual, sin borrar el resto de los datos.'},
  {cat:'Excel', q:'¿Qué hace la función SI (IF) en Excel?', opts:['Devuelve un valor si se cumple una condición y otro si no','Suma todas las celdas de una hoja','Cuenta cuántas hojas tiene el libro','Cambia el idioma de la planilla'], a:0, exp:'Por ejemplo: =SI(A1>100,"Aprobado","No aprobado").'},
  {cat:'Excel', q:'¿Cómo se llaman las "pestañas" de abajo que permiten moverte entre distintas partes de un mismo archivo de Excel?', opts:['Hojas','Libros','Rangos','Celdas'], a:0, exp:'Un mismo libro puede tener muchas hojas, cada una con sus propios datos.'},
  {cat:'Excel', q:'En Excel podés hacer un gráfico a partir de los datos de una tabla.', opts:['Verdadero','Falso'], a:0, exp:'Se pueden armar gráficos de barras, líneas, tortas y más, sin salir del programa.'},
  {cat:'Excel', q:'¿Qué función cuenta cuántas celdas de un rango tienen un número cargado?', opts:['CONTAR','CONTARA','SUMA','CONTAR.BLANCO'], a:0, exp:'CONTARA en cambio cuenta celdas que tengan cualquier tipo de contenido, no solo números.'},
  {cat:'Excel', q:'¿Para qué sirve "Ordenar y filtrar" en una lista larga de datos?', opts:['Para organizar la información y encontrarla más fácil','Para traducir el archivo a otro idioma','Para achicar el tamaño del archivo','Para agregar contraseña'], a:0, exp:'Permite, por ejemplo, ver los productos ordenados de mayor a menor precio.'},
  {cat:'Excel', q:'¿Qué es una "macro" en Excel?', opts:['Una secuencia de acciones grabada para automatizar tareas repetitivas','Un tipo de gráfico 3D','La barra de herramientas principal','Un modo de solo lectura'], a:0, exp:'Sirve para no repetir a mano los mismos pasos cada vez, por ejemplo dar formato a un reporte.'},
  {cat:'Excel', q:'Si en una celda escribís 2+2 sin el signo = adelante, ¿qué pasa?', opts:['Excel lo trata como texto y no calcula el resultado','Excel calcula 4 automáticamente','Excel da error siempre','Excel lo redondea a 0'], a:0, exp:'Sin el = al principio, Excel no interpreta lo escrito como una fórmula.'},
  {cat:'Excel', q:'¿Cómo se llama la combinación de columna y fila que identifica a cada celda (ej. B4)?', opts:['Referencia de celda','Rango dinámico','Nombre de hoja','Índice de tabla'], a:0, exp:'Esa referencia es la que se usa dentro de las fórmulas para apuntar a esa celda.'},
  {cat:'Excel', q:'Se puede proteger una hoja de Excel con contraseña para que otros no la modifiquen.', opts:['Verdadero','Falso'], a:0, exp:'Muy útil para compartir una planilla sin que se cambien accidentalmente las fórmulas.'},

  {cat:'PowerPoint', q:'¿Cómo se le llama a cada página de una presentación de PowerPoint?', opts:['Diapositiva','Hoja','Celda','Capítulo'], a:0, exp:'Una presentación es, en definitiva, una secuencia de diapositivas.'},
  {cat:'PowerPoint', q:'¿Qué extensión de archivo usan las presentaciones modernas de PowerPoint?', opts:['.pptx','.xlsx','.docx','.mp4'], a:0, exp:'.xlsx es de Excel y .docx es de Word.'},
  {cat:'PowerPoint', q:'¿Para qué sirve el "Patrón de diapositivas" en PowerPoint?', opts:['Definir un diseño que se repite en todas las diapositivas','Grabar la presentación en video','Traducir el texto automáticamente','Contar cuántas diapositivas hay'], a:0, exp:'Así no hay que repetir el mismo diseño manualmente en cada diapositiva.'},
  {cat:'PowerPoint', q:'¿Qué es una "transición" en una presentación?', opts:['El efecto visual al pasar de una diapositiva a otra','El título de la presentación','Un tipo de gráfico','El archivo de sonido de fondo'], a:0, exp:'Por ejemplo, un desvanecido o un deslizamiento al cambiar de diapositiva.'},
  {cat:'PowerPoint', q:'¿Qué es una "animación" dentro de una diapositiva de PowerPoint?', opts:['Un efecto que hace que un elemento aparezca o se mueva dentro de la diapositiva','El cambio de una diapositiva a otra','Un tipo de letra especial','La barra de progreso de la presentación'], a:0, exp:'A diferencia de la transición, la animación ocurre dentro de la misma diapositiva.'},
  {cat:'PowerPoint', q:'Buena práctica de presentaciones: ¿qué conviene evitar en una diapositiva para que el público te preste atención a vos?', opts:['Poner demasiado texto','Usar imágenes','Usar un título claro','Numerar las diapositivas'], a:0, exp:'Si hay mucho texto, el público lee la pantalla en vez de escuchar a quien expone.'},
  {cat:'PowerPoint', q:'¿Cómo se llama el modo que muestra la presentación a pantalla completa, lista para exponer?', opts:['Presentación con diapositivas','Vista Esquema','Clasificador de diapositivas','Vista Notas'], a:0, exp:'Es el modo que ve el público durante la exposición.'},
  {cat:'PowerPoint', q:'¿Qué son las "notas del orador" en PowerPoint?', opts:['Texto de ayuda que solo ve quien presenta, no el público','El resumen final de la presentación','Los comentarios del público','La lista de diapositivas'], a:0, exp:'Sirven como chuleta o guía para quien está exponiendo, sin que el público las vea.'},
  {cat:'PowerPoint', q:'Se pueden insertar videos dentro de una diapositiva de PowerPoint.', opts:['Verdadero','Falso'], a:0, exp:'Además de video se pueden insertar audios, imágenes y gráficos.'},
  {cat:'PowerPoint', q:'¿Qué es el "Clasificador de diapositivas"?', opts:['Una vista en miniatura de todas las diapositivas para reordenarlas','Un corrector ortográfico','Una función para contar palabras','Un tipo de plantilla'], a:0, exp:'Es útil para ver de un vistazo el orden completo de la presentación y reorganizarla.'},
  {cat:'PowerPoint', q:'¿Para qué sirve elegir una "plantilla" de diseño en PowerPoint?', opts:['Darle a toda la presentación un estilo visual consistente','Guardar el archivo automáticamente','Traducir la presentación','Comprimir las imágenes'], a:0, exp:'Ahorra tiempo porque no hay que diseñar cada diapositiva desde cero.'},
  {cat:'PowerPoint', q:'¿Qué elemento sirve para mostrar datos numéricos de forma visual dentro de una diapositiva?', opts:['Un gráfico','Un hipervínculo','Una nota al pie','Un encabezado'], a:0, exp:'Un gráfico de barras o de torta suele comunicar mejor que una tabla llena de números.'},
  {cat:'PowerPoint', q:'Para que se lea bien de lejos, ¿qué tamaño de letra conviene usar en una diapositiva?', opts:['Grande, no muy chico','Lo más chico posible para que entre más texto','Da igual el tamaño','Solo mayúsculas'], a:0, exp:'Si la letra es muy chica, la gente del fondo de la sala no va a poder leerla.'},
  {cat:'PowerPoint', q:'¿Qué es un "hipervínculo" en una diapositiva?', opts:['Un enlace que lleva a otro lugar al hacer clic','Un tipo de animación','El título de la diapositiva','Un efecto de sonido'], a:0, exp:'Puede llevar a otra diapositiva, a un archivo o a una página web.'},
  {cat:'PowerPoint', q:'Para que el texto se lea bien sobre el fondo de una diapositiva conviene usar...', opts:['Colores con alto contraste entre fondo y texto','Colores parecidos entre sí','Siempre fondo blanco y letra blanca','No importa el contraste'], a:0, exp:'Por ejemplo, texto oscuro sobre fondo claro, o al revés.'},
  {cat:'PowerPoint', q:'Se puede exportar una presentación de PowerPoint como PDF.', opts:['Verdadero','Falso'], a:0, exp:'Muy útil para compartirla sin que se desarme el diseño en otra computadora.'},
  {cat:'PowerPoint', q:'¿Qué es un "esquema" (outline) en PowerPoint?', opts:['Una vista con solo los títulos y textos, para organizar el contenido','Un tipo de gráfico de barras','Un efecto de sonido','El nombre del archivo'], a:0, exp:'Sirve para pensar la estructura de la presentación antes de ponerse a diseñar.'},
  {cat:'PowerPoint', q:'¿Para qué se usa el "diseño" (layout) de una diapositiva?', opts:['Definir dónde van el título, el texto y las imágenes','Cambiar el idioma','Guardar como video','Contar diapositivas'], a:0, exp:'PowerPoint trae varios diseños prearmados para organizar el contenido.'},
  {cat:'PowerPoint', q:'¿Cuál de estas es una buena regla para armar diapositivas claras?', opts:['Una idea principal por diapositiva','Meter todo el discurso escrito en la diapositiva','Usar la mayor cantidad de colores posible','Nunca usar imágenes'], a:0, exp:'Cuantas más ideas se mezclan en una sola diapositiva, más cuesta seguirla.'},
  {cat:'PowerPoint', q:'¿Qué permite hacer el "Modo Presentador" al exponer conectado a un proyector?', opts:['Ver tus notas y la próxima diapositiva mientras el público solo ve la actual','Grabar automáticamente tu voz','Traducir la presentación en vivo','Ocultar el mouse'], a:0, exp:'Es una gran ayuda para no perder el hilo mientras se expone.'},

  {cat:'Power BI', q:'¿Para qué se usa principalmente Power BI?', opts:['Para conectar, analizar y visualizar datos en informes y paneles','Para escribir documentos de texto','Para editar fotos','Para mandar correos masivos'], a:0, exp:'Transforma datos crudos en gráficos y tableros fáciles de entender.'},
  {cat:'Power BI', q:'¿Qué es un "dashboard" (panel) en Power BI?', opts:['Una pantalla con varios gráficos e indicadores que resumen información clave','Un tipo de base de datos','Un lenguaje de programación','Un archivo de Excel'], a:0, exp:'Permite ver de un vistazo cómo viene un negocio o un área, sin revisar planillas enteras.'},
  {cat:'Power BI', q:'¿De qué empresa es Power BI?', opts:['Microsoft','Google','Apple','Adobe'], a:0, exp:'Se integra bien con otras herramientas de Microsoft, como Excel.'},
  {cat:'Power BI', q:'¿Qué es DAX en Power BI?', opts:['El lenguaje de fórmulas para crear cálculos y medidas','Un tipo de gráfico circular','El nombre del archivo de Power BI','Un asistente de inteligencia artificial'], a:0, exp:'Se parece un poco a las fórmulas de Excel, pero pensado para grandes volúmenes de datos.'},
  {cat:'Power BI', q:'¿Qué extensión tienen los archivos de Power BI Desktop?', opts:['.pbix','.pptx','.xlsx','.pbi'], a:0, exp:'Ahí se guarda el informe con sus datos, cálculos y visualizaciones.'},
  {cat:'Power BI', q:'¿De dónde puede traer datos Power BI para armar un informe?', opts:['De muchas fuentes distintas: Excel, bases de datos, la web, etc.','Solo de archivos de Excel','Solo de internet','Solo de otro Power BI'], a:0, exp:'Esa flexibilidad es una de sus grandes ventajas frente a trabajar todo a mano en una sola planilla.'},
  {cat:'Power BI', q:'¿Qué es una "medida" (measure) en Power BI?', opts:['Un cálculo definido con fórmulas DAX, como una suma o un promedio','El tamaño del archivo','Un tipo de gráfico','La cantidad de usuarios conectados'], a:0, exp:'Por ejemplo, una medida puede calcular el total de ventas del mes en curso.'},
  {cat:'Power BI', q:'¿Para qué sirve un "segmentador" (slicer) en un informe de Power BI?', opts:['Permitir filtrar los datos del informe de forma interactiva','Borrar datos del origen','Cambiar el idioma del informe','Exportar a PDF automáticamente'], a:0, exp:'Por ejemplo, elegir un mes o una sucursal y que todo el informe se actualice solo.'},
  {cat:'Power BI', q:'Power BI permite publicar y compartir informes en la nube para que otros los vean online.', opts:['Verdadero','Falso'], a:0, exp:'Eso se hace a través de Power BI Service, la versión web/en la nube de la herramienta.'},
  {cat:'Power BI', q:'¿Qué parte de Power BI se usa para diseñar y armar los informes en la computadora?', opts:['Power BI Desktop','Power BI Mobile','Power BI Service solamente','Power Query solamente'], a:0, exp:'Power BI Mobile, en cambio, es para consultar los informes ya armados desde el celular.'},
  {cat:'Power BI', q:'¿Qué es "Power Query" dentro de Power BI?', opts:['La herramienta para conectar, limpiar y transformar los datos','Un tipo de gráfico avanzado','El buscador de Power BI','Un asistente de voz'], a:0, exp:'Es el primer paso antes de analizar: dejar los datos ordenados y consistentes.'},
  {cat:'Power BI', q:'¿Qué tipo de gráfico se usa comúnmente para comparar valores entre categorías?', opts:['Gráfico de barras','Mapa de calor 3D','Tabla dinámica','Ninguno de los anteriores'], a:0, exp:'Por ejemplo, comparar las ventas de distintos productos en el mismo mes.'},
  {cat:'Power BI', q:'¿Qué ventaja tiene un dashboard interactivo frente a un informe fijo en papel?', opts:['Se puede explorar y filtrar los datos en el momento','No necesita datos actualizados','Es más barato de imprimir','No se puede compartir'], a:0, exp:'Quien lo mira puede hacerse sus propias preguntas sin depender de que alguien arme un reporte nuevo.'},
  {cat:'Power BI', q:'¿Qué es una "relación" entre tablas en Power BI?', opts:['Una conexión que indica cómo se vinculan los datos de dos tablas','Un tipo de gráfico especial','Un permiso de usuario','Un filtro visual'], a:0, exp:'Por ejemplo, vincular una tabla de ventas con una tabla de productos a través de un código en común.'},
  {cat:'Power BI', q:'¿Para qué sirve "actualizar" (refrescar) los datos de un informe de Power BI?', opts:['Traer la información más reciente desde el origen de datos','Cambiar el diseño del informe','Borrar todos los gráficos','Traducir el informe'], a:0, exp:'Así el informe no queda desactualizado con el paso del tiempo.'},
  {cat:'Power BI', q:'¿Qué es un KPI (indicador clave) en un informe de gestión?', opts:['Una métrica que muestra si se está cumpliendo un objetivo del negocio','Un tipo de archivo de Power BI','Un lenguaje de programación','El nombre de un gráfico circular'], a:0, exp:'Por ejemplo, el porcentaje de ventas alcanzado respecto a la meta del mes.'},
  {cat:'Power BI', q:'En Power BI se pueden combinar datos de Excel con datos de otras fuentes en un mismo informe.', opts:['Verdadero','Falso'], a:0, exp:'Esa capacidad de combinar orígenes distintos es una de sus mayores fortalezas.'},
  {cat:'Power BI', q:'¿Qué tipo de perfil suele usar Power BI en una empresa para tomar decisiones?', opts:['Analistas, gerentes y equipos que necesitan ver la información resumida','Solo programadores','Solo diseñadores gráficos','Nadie, es solo decorativo'], a:0, exp:'Ayuda a decidir con datos concretos en vez de solo con intuición.'},
  {cat:'Power BI', q:'¿Qué significa "BI" en Power BI?', opts:['Business Intelligence (inteligencia de negocios)','Basic Interface','Binary Index','Big Images'], a:0, exp:'Es toda una disciplina orientada a usar datos para tomar mejores decisiones de negocio.'},
  {cat:'Power BI', q:'¿Cuál es una de las ventajas de usar Power BI en vez de mirar los datos "en crudo" en una planilla enorme?', opts:['Permite visualizarlos de forma más clara y encontrar patrones rápido','Ocupa menos espacio en el celular','Es gratis siempre para cualquier uso','Reemplaza la necesidad de tener datos'], a:0, exp:'Un buen gráfico puede mostrar en segundos algo que en una tabla llevaría mucho más tiempo notar.'},

  {cat:'Finanzas e Inversiones', q:'¿Qué es un "plazo fijo"?', opts:['Depositar dinero en un banco por un tiempo determinado a cambio de un interés','Un préstamo que pide el banco','Una tarjeta de crédito sin límite','Un tipo de seguro de auto'], a:0, exp:'Al vencer el plazo, se recupera el dinero depositado más el interés pactado.'},
  {cat:'Finanzas e Inversiones', q:'Si hacés un plazo fijo a 30 días, ¿podés retirar el dinero libremente antes de esos 30 días?', opts:['No, generalmente queda inmovilizado hasta el vencimiento','Sí, en cualquier momento sin ninguna condición','Solo los fines de semana','Solo si el banco está cerrado'], a:0, exp:'Por eso conviene elegir un plazo acorde a cuándo se va a necesitar ese dinero de nuevo.'},
  {cat:'Finanzas e Inversiones', q:'¿Qué son los Fondos Comunes de Inversión (FCI)?', opts:['Un conjunto de ahorros de muchos inversores administrado por profesionales','Un tipo de tarjeta de débito','Un impuesto sobre las ganancias','Un seguro obligatorio del auto'], a:0, exp:'El dinero de muchas personas se junta y una sociedad gerente lo invierte según la estrategia del fondo.'},
  {cat:'Finanzas e Inversiones', q:'Los fondos FIMA son Fondos Comunes de Inversión administrados a través de...', opts:['El Banco de la Nación Argentina','Un banco extranjero sin filial en el país','Una billetera virtual únicamente','El Estado directamente como impuesto'], a:0, exp:'Son una de las opciones de inversión más conocidas y usadas en Argentina.'},
  {cat:'Finanzas e Inversiones', q:'Comparado con un plazo fijo tradicional, ¿qué suele ofrecer un fondo común de inversión de "money market" (como un FIMA de rendimiento diario)?', opts:['Mayor liquidez para retirar el dinero más rápido','Una tasa de interés fija garantizada por ley','Cero riesgo bajo cualquier circunstancia','Un límite máximo de $1000 para invertir'], a:0, exp:'Suele poder rescatarse en 24 a 48 horas, mientras que un plazo fijo queda atado hasta su vencimiento.'},
  {cat:'Finanzas e Inversiones', q:'¿Qué es la "tasa de interés"?', opts:['El porcentaje que se cobra o se gana por prestar o depositar dinero','El precio fijo de un producto','Un impuesto municipal','El costo de una tarjeta de crédito solamente'], a:0, exp:'Puede ser a favor (cuando ahorrás) o en contra (cuando pedís un préstamo).'},
  {cat:'Finanzas e Inversiones', q:'¿Qué es la "inflación"?', opts:['El aumento generalizado y sostenido de los precios','La suba del dólar solamente','Un impuesto que cobra el banco','La cantidad de billetes que imprime el Estado en un día'], a:0, exp:'Hace que, con el tiempo, la misma cantidad de dinero alcance para comprar menos cosas.'},
  {cat:'Finanzas e Inversiones', q:'Si la inflación es más alta que la tasa de interés de tu ahorro, ¿qué pasa con tu poder de compra?', opts:['Se reduce, aunque tengas más pesos nominales','Aumenta siempre','Se mantiene exactamente igual','Se duplica automáticamente'], a:0, exp:'Por eso importa comparar el rendimiento de una inversión contra la inflación, no solo mirar el número de pesos.'},
  {cat:'Finanzas e Inversiones', q:'¿Qué significa "diversificar" una inversión?', opts:['Repartir el dinero en distintos activos para reducir el riesgo','Poner todo el dinero en un solo lugar','Gastar todo el dinero de una vez','Sacar un préstamo grande'], a:0, exp:'Así, si algo sale mal en una inversión, no se pierde todo el ahorro.'},
  {cat:'Finanzas e Inversiones', q:'¿Qué es el "interés compuesto"?', opts:['Cuando los intereses ganados también generan más intereses con el tiempo','Un interés que se cobra una sola vez','Un interés que solo aplica a préstamos','Lo mismo que la inflación'], a:0, exp:'Por eso empezar a ahorrar temprano hace una diferencia tan grande a largo plazo.'},
  {cat:'Finanzas e Inversiones', q:'¿Qué es un "presupuesto" personal o familiar?', opts:['Un plan de cuánto se espera ganar y gastar en un período','Un tipo de tarjeta bancaria','Un impuesto anual obligatorio','Un seguro de vida'], a:0, exp:'Ayuda a no gastar más de lo que se gana y a planificar el ahorro.'},
  {cat:'Finanzas e Inversiones', q:'¿Qué es una "acción" en el mercado de valores?', opts:['Una parte pequeña de la propiedad de una empresa','Un préstamo garantizado por el Estado','Un tipo de cuenta de ahorro sin riesgo','Un impuesto sobre las ventas'], a:0, exp:'Quien compra acciones se convierte en dueño de una porción muy pequeña de esa empresa.'},
  {cat:'Finanzas e Inversiones', q:'¿Qué es un "bono"?', opts:['Un instrumento de deuda: le prestás dinero a un Estado o empresa a cambio de intereses','Una acción de una empresa','Un tipo de moneda extranjera','Un descuento en el supermercado'], a:0, exp:'A diferencia de la acción, con el bono no sos dueño de la empresa, sos su acreedor.'},
  {cat:'Finanzas e Inversiones', q:'Regla básica de finanzas personales: ¿qué se recomienda armar antes de invertir, para cubrir imprevistos?', opts:['Un fondo de emergencia con ahorro disponible rápido','Una tarjeta de crédito sin límite','Un préstamo grande a largo plazo','Ninguna previsión, invertir todo de una'], a:0, exp:'Así, un imprevisto no obliga a vender una inversión de golpe en mal momento.'},
  {cat:'Finanzas e Inversiones', q:'¿Qué significa que una inversión tenga "liquidez"?', opts:['Qué tan rápido y fácil se puede convertir en dinero disponible','Cuánto interés paga por año','El color del comprobante del banco','El país donde está el banco'], a:0, exp:'Un fondo de money market suele ser más líquido que un plazo fijo a 90 días, por ejemplo.'},
  {cat:'Finanzas e Inversiones', q:'En general, ¿qué relación suele existir entre el riesgo y la ganancia esperada de una inversión?', opts:['A mayor riesgo, mayor ganancia potencial pero también mayor posibilidad de pérdida','A mayor riesgo, siempre menor ganancia','No tienen ninguna relación','El riesgo no existe si el banco es grande'], a:0, exp:'Por eso no existe una inversión "perfecta" que dé mucha ganancia sin ningún riesgo.'},
  {cat:'Finanzas e Inversiones', q:'¿Qué es el "costo de oportunidad" al elegir una inversión?', opts:['Lo que dejás de ganar por no elegir la mejor alternativa disponible','El costo fijo que cobra el banco','Un impuesto sobre las inversiones','El precio de abrir una cuenta'], a:0, exp:'Elegir una opción siempre implica resignar las demás alternativas posibles.'},
  {cat:'Finanzas e Inversiones', q:'Cuanto antes empezás a ahorrar e invertir, más tiempo tiene el interés compuesto para hacer crecer tu dinero.', opts:['Verdadero','Falso'], a:0, exp:'El tiempo es uno de los factores más poderosos a favor de quien invierte.'},
  {cat:'Finanzas e Inversiones', q:'¿Qué es un "gasto fijo" en un presupuesto?', opts:['Un gasto que se repite todos los meses por un monto similar','Un gasto que solo se hace una vez en la vida','Un impuesto que cobra el Estado','Un tipo de inversión de alto riesgo'], a:0, exp:'Por ejemplo el alquiler, las cuotas de un préstamo o los servicios básicos.'},
  {cat:'Finanzas e Inversiones', q:'¿Qué es un "gasto variable"?', opts:['Un gasto que cambia de mes a mes según el consumo','Un gasto que nunca cambia','Un tipo de plazo fijo','Un impuesto fijo mensual'], a:0, exp:'Por ejemplo, salidas, compras extra o regalos, que no son iguales todos los meses.'},
  {cat:'Finanzas e Inversiones', q:'¿Para qué sirve comparar tasas de interés entre distintos bancos antes de hacer un plazo fijo?', opts:['Para elegir la opción que te dé mejor rendimiento por tu dinero','Porque todos los bancos están obligados a dar la misma tasa','Para pagar menos impuestos','No sirve, siempre es igual'], a:0, exp:'Las tasas pueden variar bastante de un banco a otro para el mismo producto.'},
  {cat:'Finanzas e Inversiones', q:'¿Qué es la tasa "TNA" (Tasa Nominal Anual) que suelen mostrar los bancos?', opts:['Una forma estándar de expresar el interés anual de un producto financiero','Un impuesto que se paga una sola vez','El nombre de un fondo de inversión','El código de una tarjeta de débito'], a:0, exp:'Sirve para poder comparar distintas opciones de ahorro o crédito en las mismas condiciones.'},
  {cat:'Finanzas e Inversiones', q:'¿Qué organismo regula los Fondos Comunes de Inversión en Argentina?', opts:['La Comisión Nacional de Valores (CNV)','El Ministerio de Educación','La AFIP únicamente','No hay ningún organismo regulador'], a:0, exp:'La CNV supervisa el mercado de capitales para proteger a quienes invierten.'},
  {cat:'Finanzas e Inversiones', q:'Ahorrar una parte de los ingresos todos los meses, aunque sea poco, ayuda a largo plazo a...', opts:['Construir un colchón financiero y alcanzar metas futuras','Pagar más impuestos','Perder poder adquisitivo siempre','No tiene ningún beneficio'], a:0, exp:'El hábito de ahorrar de forma constante suele importar más que el monto puntual de cada mes.'},

  {cat:'Administración y Ventas', q:'¿Qué es la "administración" de una empresa?', opts:['Planificar, organizar, dirigir y controlar los recursos para lograr objetivos','Solamente vender productos','Solamente cobrar facturas','Solamente contratar personal'], a:0, exp:'Es una disciplina mucho más amplia que solo una de esas tareas puntuales.'},
  {cat:'Administración y Ventas', q:'¿Qué es una "factura"?', opts:['Un documento que certifica una compra o venta, con el detalle y precio','Un tipo de cheque','Un contrato de alquiler','Un recibo de sueldo'], a:0, exp:'Es el respaldo formal de una operación comercial, tanto para quien compra como para quien vende.'},
  {cat:'Administración y Ventas', q:'¿Qué diferencia hay entre "cliente" y "consumidor"?', opts:['El cliente compra, el consumidor usa el producto (pueden ser la misma persona o no)','Son exactamente lo mismo siempre','El consumidor paga y el cliente no','No hay ninguna diferencia posible'], a:0, exp:'Por ejemplo, un padre que compra pañales es el cliente, pero el consumidor es el bebé.'},
  {cat:'Administración y Ventas', q:'¿Qué es el "stock" o inventario de un negocio?', opts:['La cantidad de mercadería disponible para vender','El dinero en la caja registradora','La lista de empleados','El horario de atención'], a:0, exp:'Llevar bien el stock evita quedarse sin productos o comprar de más.'},
  {cat:'Administración y Ventas', q:'¿Qué es un "presupuesto" en el contexto de una venta?', opts:['Una estimación del costo antes de cerrar la venta','Un impuesto sobre las ventas','Un tipo de factura ya pagada','Un contrato firmado y definitivo'], a:0, exp:'Se le entrega al posible cliente antes de que confirme la compra.'},
  {cat:'Administración y Ventas', q:'¿Qué significa "fidelizar" a un cliente?', opts:['Lograr que vuelva a comprar y se mantenga leal al negocio','Cobrarle más caro que a los demás','Venderle una sola vez y no más','Ignorar sus reclamos'], a:0, exp:'Conseguir un cliente nuevo suele costar más que mantener a uno que ya confía en el negocio.'},
  {cat:'Administración y Ventas', q:'¿Qué es el "margen de ganancia"?', opts:['La diferencia entre el precio de venta y el costo del producto','El precio total de venta','El impuesto que se paga por vender','El sueldo del vendedor'], a:0, exp:'Es lo que realmente queda como ganancia después de cubrir el costo de lo vendido.'},
  {cat:'Administración y Ventas', q:'¿Qué es un "organigrama"?', opts:['Un esquema que muestra la estructura jerárquica de una empresa','Un tipo de factura','Un gráfico de ventas mensuales','Un plan de marketing'], a:0, exp:'Ayuda a entender quién depende de quién y cómo están organizadas las áreas.'},
  {cat:'Administración y Ventas', q:'¿Qué área de una empresa se encarga típicamente de contratar y gestionar al personal?', opts:['Recursos Humanos','Contabilidad','Logística','Atención al cliente'], a:0, exp:'También se ocupa de la capacitación, los sueldos y el clima laboral.'},
  {cat:'Administración y Ventas', q:'¿Qué es el "marketing"?', opts:['El conjunto de estrategias para promocionar y vender entendiendo al cliente','Solamente la publicidad en redes sociales','Solamente el diseño del logo','Solamente cobrar más caro'], a:0, exp:'Incluye investigar al cliente, definir el producto, el precio y cómo comunicarlo.'},
  {cat:'Administración y Ventas', q:'¿Qué es un "proveedor"?', opts:['Una empresa o persona que le vende insumos o mercadería a otro negocio','El cliente final de un producto','El dueño de la empresa','Un tipo de impuesto'], a:0, exp:'Por ejemplo, quien le vende la harina a una panadería es su proveedor.'},
  {cat:'Administración y Ventas', q:'¿Qué es la "atención al cliente"?', opts:['El servicio de acompañar, ayudar y resolver dudas de quien compra','Solo el momento de cobrar','Solo responder reclamos por escrito','Un área que no existe en las pymes'], a:0, exp:'Una buena atención puede ser tan importante como el producto mismo para que el cliente vuelva.'},
  {cat:'Administración y Ventas', q:'¿Qué significa la sigla "PyME"?', opts:['Pequeña y Mediana Empresa','Producto y Mercado Estable','Plan y Meta Empresarial','Precio y Margen Estimado'], a:0, exp:'Las PyMEs son una parte fundamental de la economía en Argentina.'},
  {cat:'Administración y Ventas', q:'En ventas, ¿qué significa "cerrar una venta"?', opts:['Lograr que el cliente confirme la compra','Cerrar el local al final del día','Cancelar un pedido','Devolver un producto'], a:0, exp:'Es el objetivo final de todo el proceso comercial con un cliente.'},
  {cat:'Administración y Ventas', q:'¿Qué es la "competencia" para un negocio?', opts:['Otras empresas que ofrecen productos o servicios similares','Los empleados del mismo negocio','Los clientes que no compran nunca','Un tipo de impuesto municipal'], a:0, exp:'Conocer a la competencia ayuda a diferenciarse y mejorar la propuesta propia.'},
  {cat:'Administración y Ventas', q:'¿Qué es una "meta de ventas"?', opts:['Un objetivo numérico de cuánto se espera vender en un período','Un tipo de descuento fijo','El sueldo de un vendedor','Un impuesto sobre las ganancias'], a:0, exp:'Sirve para medir si el negocio está cumpliendo con lo planificado.'},
  {cat:'Administración y Ventas', q:'¿Qué es la "posventa"?', opts:['La atención y seguimiento al cliente después de comprar','El momento exacto de pagar','Un tipo de factura especial','El precio final con descuento'], a:0, exp:'Incluye cosas como la garantía, el soporte técnico o simplemente preguntar si quedó conforme.'},
  {cat:'Administración y Ventas', q:'¿Qué significa "negociar" en una venta?', opts:['Buscar un acuerdo entre comprador y vendedor sobre las condiciones','Bajar siempre el precio al mínimo','Nunca ceder en nada','Cancelar la venta automáticamente'], a:0, exp:'Una buena negociación busca que ambas partes queden conformes con el resultado.'},
  {cat:'Administración y Ventas', q:'¿Qué es un "plan de negocio"?', opts:['Un documento que describe la idea, el mercado y la estrategia de un emprendimiento','Un tipo de factura mensual','El horario de un local','La lista de precios solamente'], a:0, exp:'Suele incluir también una proyección de costos e ingresos esperados.'},
  {cat:'Administración y Ventas', q:'¿Por qué es importante escuchar las quejas o reclamos de un cliente?', opts:['Porque ayudan a mejorar y a no perder al cliente','Porque es obligatorio por ley responder en 24hs siempre','Porque generan una multa si no se atienden','No es importante, se pueden ignorar'], a:0, exp:'Un reclamo bien resuelto puede incluso fortalecer la confianza del cliente en el negocio.'},

  {cat:'Valores de la vida', q:'La honestidad significa decir la verdad y actuar de forma coherente con lo que uno piensa.', opts:['Verdadero','Falso'], a:0, exp:'Ser honesto también implica no engañar ni aprovecharse de la confianza de los demás.'},
  {cat:'Valores de la vida', q:'¿Qué significa "empatía"?', opts:['Ponerse en el lugar del otro y entender lo que siente','Estar siempre de acuerdo con todos','Ignorar los problemas ajenos','Ganar siempre en una discusión'], a:0, exp:'No implica estar de acuerdo con el otro, sino entender su punto de vista.'},
  {cat:'Valores de la vida', q:'Si un compañero de equipo se equivoca, ¿cuál actitud ayuda más al grupo?', opts:['Ayudarlo a corregirlo con respeto','Burlarse delante de todos','Ignorarlo por completo','Quejarse a sus espaldas'], a:0, exp:'Un error bien manejado en equipo se convierte en un aprendizaje, no en un conflicto.'},
  {cat:'Valores de la vida', q:'¿Qué es la "responsabilidad"?', opts:['Cumplir lo que uno se compromete y hacerse cargo de sus actos','Culpar a otros por los propios errores','Hacer solo lo que a uno le conviene','Prometer cosas sin intención de cumplirlas'], a:0, exp:'Incluye también asumir las consecuencias cuando algo sale mal.'},
  {cat:'Valores de la vida', q:'El trabajo en equipo funciona mejor cuando cada uno...', opts:['Aporta lo suyo y también escucha a los demás','Impone siempre su propia idea','Trabaja solo, sin coordinar con nadie','Compite para quedar mejor que sus compañeros'], a:0, exp:'Un buen equipo combina las fortalezas de cada integrante en vez de competir entre ellos.'},
  {cat:'Valores de la vida', q:'¿Qué es la "perseverancia"?', opts:['Seguir intentando a pesar de las dificultades','Rendirse apenas algo se complica','Hacer solo lo fácil','Depender siempre de otros para todo'], a:0, exp:'Muchos logros importantes llevaron varios intentos antes de conseguirse.'},
  {cat:'Valores de la vida', q:'Pedir disculpas cuando uno se equivoca es un signo de madurez, no de debilidad.', opts:['Verdadero','Falso'], a:0, exp:'Reconocer un error a tiempo suele fortalecer la confianza con los demás, no debilitarla.'},
  {cat:'Valores de la vida', q:'¿Qué significa "respetar" a otra persona?', opts:['Tratarla con consideración aunque piense distinto','Estar de acuerdo con todo lo que dice','Evitarla si opina diferente','Solo respetar a quien piensa igual'], a:0, exp:'El respeto no depende de estar de acuerdo, sino de cómo se trata al otro.'},
  {cat:'Valores de la vida', q:'¿Por qué es importante la puntualidad?', opts:['Porque demuestra respeto por el tiempo de los demás','Porque es una norma sin ningún motivo real','Solo importa en el trabajo, no en la vida diaria','No tiene ninguna importancia real'], a:0, exp:'Llegar tarde afecta también los planes de las personas que sí llegaron a horario.'},
  {cat:'Valores de la vida', q:'¿Qué es la "gratitud"?', opts:['Reconocer y valorar lo que otros hacen por uno','Sentir que a uno nunca le deben nada','Exigir siempre más de lo que se recibe','Compararse constantemente con los demás'], a:0, exp:'Practicar la gratitud está asociado con mayor bienestar emocional.'},
  {cat:'Valores de la vida', q:'Si alguien te cuenta un secreto en confianza, lo correcto es...', opts:['Respetar esa confianza y no contarlo sin permiso','Contárselo a todos tus amigos','Usarlo en su contra','Publicarlo en redes sociales'], a:0, exp:'Traicionar una confianza suele romper una relación de forma difícil de reparar.'},
  {cat:'Valores de la vida', q:'¿Qué significa ser "solidario"?', opts:['Ayudar a otros de forma desinteresada','Ayudar solo cuando conviene a uno','Esperar siempre algo a cambio','Ignorar a quien pide ayuda'], a:0, exp:'La solidaridad no busca una recompensa a cambio de la ayuda que se ofrece.'},
  {cat:'Valores de la vida', q:'Escuchar con atención a alguien, sin interrumpir, es una forma de mostrar respeto.', opts:['Verdadero','Falso'], a:0, exp:'Saber escuchar es una habilidad tan importante como saber hablar.'},
  {cat:'Valores de la vida', q:'¿Qué es la "tolerancia"?', opts:['Aceptar y respetar las diferencias de los demás','Imponer la propia forma de pensar a todos','Rechazar todo lo que es distinto','Ignorar a quien piensa diferente'], a:0, exp:'Convivir con personas distintas a uno enriquece mucho más de lo que parece a primera vista.'},
  {cat:'Valores de la vida', q:'¿Por qué es valioso el esfuerzo, incluso cuando el resultado no es perfecto?', opts:['Porque el proceso de intentarlo enseña y hace crecer','Porque solo importa ganar siempre','El esfuerzo no tiene ningún valor si no se gana','Es mejor no intentarlo si no hay garantía de éxito'], a:0, exp:'Muchas veces se aprende más del camino recorrido que del resultado final.'},
  {cat:'Valores de la vida', q:'¿Qué es la "humildad"?', opts:['Reconocer los propios errores y límites, sin creerse superior','Creer que uno siempre tiene la razón','Menospreciar los logros propios','Competir para sentirse mejor que otros'], a:0, exp:'Ser humilde no significa no valorarse, sino no sentirse por encima de los demás.'},
  {cat:'Valores de la vida', q:'Un buen líder de equipo se caracteriza por...', opts:['Escuchar, guiar y valorar el aporte de cada integrante','Dar órdenes sin explicar nada','Quedarse con el crédito del trabajo de todos','Ignorar las opiniones del equipo'], a:0, exp:'Un buen líder suma a los demás en vez de opacarlos.'},
  {cat:'Valores de la vida', q:'Cumplir la palabra que uno da es una forma concreta de generar confianza con los demás.', opts:['Verdadero','Falso'], a:0, exp:'La confianza se construye de a poco, con acciones coherentes en el tiempo.'},
  {cat:'Valores de la vida', q:'¿Qué significa tener "actitud positiva" frente a un problema?', opts:['Buscar soluciones en vez de quedarse solo lamentando el problema','Fingir que el problema no existe','Culpar siempre a otros','Evitar cualquier desafío'], a:0, exp:'No implica ignorar la dificultad, sino enfocarse en cómo resolverla.'},
  {cat:'Valores de la vida', q:'¿Por qué es importante cuidar el medio ambiente en las decisiones de todos los días?', opts:['Porque los recursos naturales son limitados y afectan al futuro','Porque no tiene ningún efecto real','Solo les importa a algunos países','Es un tema que no involucra a las personas comunes'], a:0, exp:'Pequeñas decisiones cotidianas, multiplicadas por millones de personas, generan un impacto real.'},

  {cat:'Matemática', q:'¿Cuánto es 24 + 38?', opts:['62','58','64','52'], a:0, exp:'24 + 38 = 62.'},

/* ═══════════════════════════════════════════════════════════════
   ARCADE — orquestador de "varios juegos, mismos jugadores". Vive
   ARRIBA de cada juego (state.match / state.online siguen siendo
   del juego que está activo en cada momento) y solo se encarga de:
   elegir qué juego sigue, y sumar los puntos de cada juego a un
   marcador general. Cada juego avisa que terminó llamando a
   arcadeGameEnded(deltas), con deltas = {jugadorId: puntosGanados}.
   ═══════════════════════════════════════════════════════════════ */
function arcadePickNext(enabled, played){
  // excluye solo el último jugado (no todo el historial) para que nunca se repita
  // el mismo juego dos veces seguidas — con 2 juegos habilitados esto da "uno y uno" siempre
  const last = played[played.length-1];
  let pool = enabled.filter(id => id !== last);
  if(pool.length===0) pool = enabled.slice(); // solo 1 juego habilitado: no hay otra opción
  return pool[Math.floor(Math.random()*pool.length)];
}
function arcadeLocalNext(){
  const a = state.arcadeLocal;
  const id = arcadePickNext(a.enabled, a.played);
  a.played.push(id); a.current = id;
  if(id==='preguntados') arcadeMountPreguntadosLocal(a);
  else if(id==='ahorcado') arcadeMountAhorcadoLocal(a);
  else if(id==='mimica') arcadeMountMimicaLocal(a);
  else if(id==='generala') arcadeMountGeneralaLocal(a);
  else if(id==='ingles') arcadeMountEnglishLocal(a);
  else arcadeMountTuttiFrutiLocal(a);
}
function arcadeMountTuttiFrutiLocal(a){
  state.match = {
    mode: 'local', players: a.players, deck: a.deck, usedLetters: [], roundNumber: 1, currentLetter: null,
    turnIndex: 0, roundAnswers: {}, scores: Object.fromEntries(a.players.map(p=>[p.id,0])), rounds: [],
  };
  saveMatch();
  drawNextLetter();
  startTurn();
}
function arcadeMountPreguntadosLocal(a){
  const n = Math.min(PREG_QUESTIONS_PER_MATCH, PREGUNTADOS_BANK.length);
  state.pregMatch = {

function ahorcadoGuess(letter){
  const m = state.ahorcadoMatch; if(!m || m._done) return;
  const w = m.words[m.turnIndex];
  const key = document.getElementById('ah-key-'+letter);
  if(!key || key.disabled) return;
  key.disabled = true;
  if(w.word.includes(letter)){
    m.guessed.push(letter);
    key.classList.add('trivia-correct');
    beep(880,0.12,0);
  } else {
    m.wrong++;
    key.classList.add('trivia-wrong');
    beep(220,0.18,0);
  }
  document.getElementById('ah-word').textContent = ahorcadoWordDisplay();
  document.getElementById('ah-lives').textContent = ahorcadoLivesDisplay();
  const won = w.word.split('').every(ch => m.guessed.includes(ch));
  const lost = m.wrong >= AHORCADO_LIVES;
  if(won || lost) ahorcadoFinishTurn(won);
}
function ahorcadoFinishTurn(won){
  const m = state.ahorcadoMatch; const player = m.players[m.turnIndex]; const w = m.words[m.turnIndex];
  const isOnline = m.mode==='online';
  m._done = true;
  document.querySelectorAll('#ah-keyboard button').forEach(b=>b.disabled=true);
  const points = won ? Math.max(20, 100 - m.wrong*15) : 0;
  if(!isOnline){

    m.rounds.push({ playerId: player.id, word: w.word, won, wrong:m.wrong, points });
  }

  resEl.style.display = 'block';
  resEl.innerHTML = `<div style="font-size:32px">${won?'🎉':'😵'}</div>

  if(won) confettiBurst(16); else soundEnd();

}

/* ═══════════════════════════════════════════════════════════════
   GENERALA — local. Ronda clásica completa: cada jugador va tirando
   por turnos (hasta 3 tiradas, guardando los dados que quiera) y
   anota en una categoría libre, hasta que todos completaron las 10.
   ═══════════════════════════════════════════════════════════════ */
function arcadeMountGeneralaLocal(a){
  state.generalaMatch = {
    mode:'local', players:a.players, turnIndex:0,
    used: Object.fromEntries(a.players.map(p=>[p.id,{}])),
    dice:[0,0,0,0,0], held:[false,false,false,false,false], rollsLeft:3,
  };
  generalaGotoNextTurn(true);
}
function generalaPlayerDone(m, playerId){ return Object.keys(m.used[playerId]).length >= GENERALA_CATS.length; }
function generalaGotoNextTurn(isFirst){
  const m = state.generalaMatch;
  if(!isFirst) m.turnIndex = (m.turnIndex+1) % m.players.length;
  let tries = 0;
  while(generalaPlayerDone(m, m.players[m.turnIndex].id) && tries < m.players.length){
    m.turnIndex = (m.turnIndex+1) % m.players.length; tries++;
  }
  if(tries >= m.players.length){ endGeneralaLocalMatch(); return; }
  m.dice = [0,0,0,0,0]; m.held = [false,false,false,false,false]; m.rollsLeft = 3; m._handoffDone = false;
  state.screen = 'generalaTurnLocal'; render(); document.getElementById('bottomnav').style.display='none';
}
function generalaDismissHandoff(){
  state.generalaMatch._handoffDone = true;
  const el = document.getElementById('handoff-overlay'); if(el) el.remove();
}
function renderGeneralaTurnLocal(app){
  const m = state.generalaMatch; const player = m.players[m.turnIndex];
  document.getElementById('bottomnav').style.display='none';
  const usedCats = m.used[player.id];
  app.innerHTML = `
    ${m._handoffDone ? '' : `<div class="handoff" id="handoff-overlay">
      <span class="ic">🎲</span>
      <h2>Pasale el celular a<br><span style="color:var(--accent)">${esc(player.name)}</span></h2>
      <div class="sub" style="margin-bottom:24px">Que nadie más mire la pantalla</div>
      <button class="btn btn-primary btn-lg" onclick="generalaDismissHandoff()">Listo, soy ${esc(player.name)}</button>
    </div>`}
    <div class="screen" style="padding-top:20px">
      <div class="sub center" style="margin-bottom:8px">Tiradas restantes: <b>${m.rollsLeft}</b></div>
      <div class="dice-row">
        ${m.dice.map((v,i)=>`<button class="die ${m.held[i]?'held':''}" onclick="generalaToggleHold(${i})">${v?DICE_FACES[v]:'?'}</button>`).join('')}
      </div>
      <button class="btn btn-primary btn-lg btn-block" style="margin-top:14px" onclick="generalaRoll()" ${m.rollsLeft<=0?'disabled':''}>🎲 Tirar</button>
      <div class="sub center" style="margin:12px 0 6px">Tocá un dado para guardarlo antes de volver a tirar</div>
      <h3 style="margin-top:10px">Anotar en...</h3>
      <div class="generala-cats">
        ${GENERALA_CATS.map(c=>{
          const already = usedCats[c.id];
          const preview = m.dice.some(v=>v>0) ? c.calc(m.dice) : null;
          const disabled = already!=null || m.rollsLeft===3;
          return `<button class="gen-cat ${already!=null?'used':''}" ${disabled?'disabled':''} onclick="generalaScore('${c.id}')">
            <span class="nm">${c.label}</span><span class="pt">${already!=null?already:(preview!=null?preview:'—')}</span>
          </button>`;
        }).join('')}
      </div>
    </div>`;
}
function generalaToggleHold(i){
  const m = state.generalaMatch;
  if(m.dice[i]===0) return;
  m.held[i] = !m.held[i];
  render();
}
function generalaRoll(){
  const m = state.generalaMatch;
  if(m.rollsLeft<=0) return;
  m.dice = m.dice.map((v,i)=> m.held[i] ? v : rollDie());
  m.rollsLeft--;
  beep(440,0.08,0); beep(660,0.08,0.08);
  render();
}
function generalaScore(catId){
  const m = state.generalaMatch; const player = m.players[m.turnIndex];
  if(m.used[player.id][catId]!=null || m.rollsLeft===3) return;
  const cat = GENERALA_CATS.find(c=>c.id===catId);
  const points = cat.calc(m.dice);
  m.used[player.id][catId] = points;
  beep(points>0?880:220, 0.15, 0);
  if(points>=40) confettiBurst(20);
  generalaGotoNextTurn(false);
}
function endGeneralaLocalMatch(){
  const m = state.generalaMatch;
  const scores = {};
  m.players.forEach(p => { scores[p.id] = Object.values(m.used[p.id]).reduce((s,x)=>s+x,0); });
  const rounds = m.players.map(p => ({ playerId:p.id, used:m.used[p.id] }));
  const record = { id: uid(), date: Date.now(), mode:'local', game:'generala', rounds,
    players: m.players.map(p=>({name:p.name, points:scores[p.id]})) };
  state.history.push(record);
  m.players.forEach(pm => { const p = state.players.find(x=>x.id===pm.id); if(!p) return; p.games++; p.points += scores[pm.id]; });
  saveAll();
  state.generalaMatch = null;
  if(state.arcadeLocal) arcadeGameEnded(scores);
  else { state.screen='matchEnd'; state._lastRecord=record; render(); confettiBurst(40); }
}

function engMountWord(){
  const w = engWords[engIdx];

function engRenderBoard(){

  if(!slots || !tiles) return;
  slots.innerHTML = w.en.split('').map((_,i)=>`<span class="eng-slot ${engBuilt[i]?'filled':''}">${engBuilt[i]||''}</span>`).join('');
  tiles.innerHTML = engTiles.map((t,ti)=>`<button class="eng-tile" ${t.used?'disabled':''} onclick="engTapTile(${ti})">${t.letter}</button>`).join('');

function engTapTile(ti){
  if(engEnded) return;
  const t = engTiles[ti]; if(!t || t.used) return;
  t.used = true; engBuilt.push(t.letter); engBuiltTiles.push(ti);
  engRenderBoard();

      engCorrect++; document.getElementById('eng-correct').textContent = engCorrect;

/* ═══════════════════════════════════════════════════════════════
   AHORCADO / ARMAPALABRAS — online. A diferencia de Tutti Fruti y
   Preguntados (todos responden en paralelo), estos dos son "un
   jugador activo por vez, los demás esperan": el anfitrión arma un
   orden de turnos (él mismo + cada invitado) y va avisando a cada
   uno cuándo le toca. Reutiliza las mismas funciones de juego que
   ya usa el modo local (ahorcadoGuess, engTapTile, etc.) — cada
   dispositivo solo conoce SU propio turno, nunca el de los demás.
   ═══════════════════════════════════════════════════════════════ */
function hostStartAhorcadoOnline(){
  const o = state.online;
  hostCancelPersistentBroadcast();
  const order = ['me'].concat(Object.keys(o.guests));
  const words = shuffleArr(AHORCADO_BANK).slice(0, order.length);
  o.ahorcado = { order, turnIdx: -1, words, deltas: {} };
  hostAhorcadoNextTurn();

function hostAhorcadoNextTurn(){

function arcadeGameEnded(deltas){
  const isOnline = !!state.online;
  const a = isOnline ? state.online.arcade : state.arcadeLocal;
  if(!a){
    // no hay sesión de Arcade activa (ej: retomando una partida vieja después de un refresh) — no hay marcador general a donde volver
    state.screen = 'matchEnd';
    render();
    return;
  }
  Object.entries(deltas).forEach(([pid, pts])=>{
    const s = a.scoreboard[pid] || (a.scoreboard[pid] = { total:0, byGame:{} });
    s.total += (pts||0);
    s.byGame[a.current] = (s.byGame[a.current]||0) + (pts||0);
  });
  a.current = null;
  const playersList = isOnline
    ? [{id:'me', name: state.online.myName}].concat(Object.entries(state.online.guests).map(([pid,g])=>({id:pid, name:g.name})))
    : a.players;
  state._arcadePlayers = playersList;
  if(isOnline){
    hostBroadcastPersistent({ type:'arcadeScoreboard', scoreboard: a.scoreboard, playersList });
  }
  state.screen = 'arcadeScoreboard'; render();
  confettiBurst(16);
}
function renderArcadeScoreboard(app){
  const isOnline = !!state.online;
  const a = isOnline ? state.online.arcade : state.arcadeLocal;
  const players = state._arcadePlayers || (a ? (isOnline ? [] : a.players) : []);
  const sb = (a && a.scoreboard) || {};
  const sorted = [...players].sort((x,y)=>(sb[y.id]?.total||0)-(sb[x.id]?.total||0));
  const gamesPlayed = [...new Set(players.flatMap(p => Object.keys((sb[p.id]||{}).byGame||{})))];
  const isHost = !isOnline || state.online.role==='host';
  app.innerHTML = `
    ${topbar('🎮 Marcador general', gamesPlayed.map(g=>(GAMES_META[g]?.icon||'')+' '+(GAMES_META[g]?.name||g)).join(' · '))}
    <div class="screen">
      <div class="score-list">
        ${sorted.map((p,i)=>`<div class="score-item ${i===0?'first':''}">
          <span class="pos">${i+1}°</span><span class="nm grow">${esc(p.name)}</span>
          <span class="pt" data-val="${sb[p.id]?.total||0}">0</span>
        </div>
        ${gamesPlayed.length>1 ? `<div class="sub" style="margin:-4px 0 10px 30px">${gamesPlayed.map(g=>`${GAMES_META[g]?.icon||''} ${(sb[p.id]||{}).byGame?.[g]||0}`).join('&nbsp;&nbsp;&nbsp;')}</div>` : ''}`).join('')}
      </div>
      ${isHost ? `
        <div class="row" style="margin-top:18px">
          <button class="btn btn-primary btn-lg grow" onclick="${isOnline?'arcadeOnlineNext()':'arcadeLocalNext()'}">🎲 Siguiente juego</button>
        </div>
        <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="arcadeFinish()">🏁 Terminar acá</button>
      ` : `<div class="sub center" style="margin-top:16px">Esperando que el anfitrión elija el próximo juego...</div>`}
    </div>`;
  animateScoreCounts(app);
}
function arcadeFinish(){
  const isOnline = !!state.online;
  const a = isOnline ? state.online.arcade : state.arcadeLocal;
  const players = state._arcadePlayers || (a ? a.players : []);
  const sb = (a && a.scoreboard) || {};
  const record = { players: players.map(p=>({name:p.name, points: sb[p.id]?.total||0})), roundsCount: a ? a.played.length : 0, isArcade:true };
  if(isOnline){
    hostBroadcast({ type:'matchEnd', players: record.players, roundsCount: state.online.arcade.played.length, isArcade:true });
    hideVideoStrip();
    try{ state.online.peer.destroy(); }catch(e){}
    state.online = null;
  } else {
    state.arcadeLocal = null;
  }
  state._lastRecord = record; state.screen = 'matchEnd'; render();
  confettiBurst(40);
}

function pqSetCorrect(i){ pregQEditState.a = i; render(); }
function pqAddOpt(){ if(pregQEditState.opts.length<4){ pregQEditState.opts.push(''); render(); } }
function pqRemoveOpt(i){
  if(pregQEditState.opts.length<=2) return;
  pregQEditState.opts.splice(i,1);
  if(pregQEditState.a>=pregQEditState.opts.length) pregQEditState.a = 0;
  else if(pregQEditState.a>i) pregQEditState.a--;
  render();
}
function pqSave(){
  const s = pregQEditState;
  const cat = s.cat.trim(); const q = s.q.trim(); const opts = s.opts.map(o=>o.trim());
  if(!cat){ toast('Ponele una categoría'); return; }
  if(!q){ toast('Falta el texto de la pregunta'); return; }
  if(opts.some(o=>!o)){ toast('Completá todas las opciones'); return; }
  const entry = { id: s.id || uid(), cat, q, opts, a: s.a, exp: s.exp.trim() };
  const i = state.customQuestions.findIndex(x=>x.id===entry.id);
  if(i>=0) state.customQuestions[i] = entry; else state.customQuestions.push(entry);
  saveAll(); pregQEditState = null;
  document.getElementById('bottomnav').style.display = 'flex';
  nav('preguntas');
  toast('Pregunta guardada');
}
function deleteQuestion(id){
  if(!confirm('¿Borrar esta pregunta?')) return;
  state.customQuestions = state.customQuestions.filter(q=>q.id!==id);
  saveAll(); pregQEditState = null;
  document.getElementById('bottomnav').style.display = 'flex';
  nav('preguntas');
}

function resumeMatch(){

}
function drawNextLetter(){
  const m = state.match;
  let pool = ALL_LETTERS.filter(l => state.settings.letters[l] && !m.usedLetters.includes(l));
  if(pool.length===0){ m.usedLetters = []; pool = ALL_LETTERS.filter(l => state.settings.letters[l]); }
  m.currentLetter = pool[Math.floor(Math.random()*pool.length)];
  m.usedLetters.push(m.currentLetter);
  m.turnIndex = 0; m.roundAnswers = {};
  saveMatch();
}

let turnSubmitted = false;
let turnCountdownPlayed = false;
function beginTurnTimer(){
  const secs = state.settings.seconds;
  turnSubmitted = false;
  spinLetterBadge(document.getElementById('letter-badge'), state.match.currentLetter);
  if(secs===0) return;
  turnCountdownPlayed = false;
  const endsAt = Date.now() + secs*1000;
  clearInterval(turnTimer);
  const tick = ()=>{
    const disp = document.getElementById('timer-display'); const bar = document.getElementById('timer-bar');
    if(!disp){ clearInterval(turnTimer); return; }
    const remaining = Math.max(0, Math.ceil((endsAt - Date.now())/1000));
    disp.textContent = remaining;
    bar.style.width = (remaining/secs*100)+'%';
    disp.classList.toggle('low', remaining<=10);
    if(remaining<=3 && remaining>0 && !turnCountdownPlayed){ turnCountdownPlayed = true; soundCountdown(); }
    if(remaining<=0){ clearInterval(turnTimer); soundEnd(); submitTurn(); }
  };
  turnTimer = setInterval(tick, 250);
  tick();
}
function submitTurn(){
  if(turnSubmitted) return;
  turnSubmitted = true;
  clearInterval(turnTimer);
  const m = state.match; const player = m.players[m.turnIndex];
  const answers = {};
  m.deck.forEach((c,i)=>{ const el = document.getElementById('ci-'+i); answers[c] = el ? el.value.trim() : ''; });
  m.roundAnswers[player.id] = answers;
  m.turnIndex++;
  saveMatch();
  if(m.turnIndex < m.players.length){ startTurn(); }
  else { enterCorrectionLocal(); }
}

function enterCorrectionLocal(){
  const m = state.match;
  state.screen = 'correctionLocal';
  m._results = null;
  render();
  const players = m.players.map(p => ({ id:p.id, answers: m.roundAnswers[p.id]||{} }));
  computeResults(m.deck, players, m.currentLetter).then(results => {
    if(state.match !== m) return;
    m._results = results; saveMatch();
    if(state.screen==='correctionLocal') render();
  });
}
const STATUS_LABEL = { ok:'Válida', rep:'Repetida', bad:'Inválida', rev:'¿Existe?' };

    <div class="screen">
      ${m.deck.map(cat => `
        <div class="correct-cat"><h4>${esc(cat)}</h4>
          ${m.players.map(p => {

            return `<div class="ans-row">
              <span class="name">${esc(p.name)}</span>
              <span class="txt ${r.text?'':'empty'}">${r.text?esc(r.text):'(vacío)'}</span>

            </div>
            ${r.desc ? `<div class="ans-desc">${esc(r.desc)}</div>` : (r.status==='rev' ? `<div class="ans-desc">No la encontramos en el diccionario — revisala a mano.</div>` : '')}`;

function cycleStatus(playerId, cat){
  const results = state.screen==='onlineReview' ? state.online.reviewResults : state.match._results;
  const r = results[playerId][cat];
  const order = ['ok','rep','bad']; const next = order[(order.indexOf(r.status)+1)%order.length];
  r.status = next;
  r.points = next==='ok' ? state.settings.scoreUnique : next==='rep' ? state.settings.scoreRepeated : state.settings.scoreEmpty;
  render();
  if(state.screen==='onlineReview') broadcastReviewUpdate();
}
function confirmRoundScore(){
  const m = state.match; const results = m._results;
  m.players.forEach(p => {
    const total = Object.values(results[p.id]||{}).reduce((s,r)=>s+r.points,0);
    m.scores[p.id] = (m.scores[p.id]||0) + total;
  });
  m.rounds.push({ letter: m.currentLetter, results });
  m.currentLetter = null; m._results = null;
  saveMatch();
  state.screen = 'roundScoreboard'; render();
  confettiBurst(16);
}

function removeFromMatch(playerId){
  const m = state.match;
  if(m.players.length<=2){ toast('Necesitás al menos 2 jugadores para seguir la partida'); return; }
  const p = m.players.find(x=>x.id===playerId);
  if(!p || !confirm(`¿Sacar a ${p.name} de esta partida? Lo que ya sumó queda, pero no juega más rondas.`)) return;
  m.players = m.players.filter(x=>x.id!==playerId);
  saveMatch();
  render();
}
function endLocalMatch(){
  const m = state.match;
  const record = { id: uid(), date: Date.now(), mode: 'local', rounds: m.rounds,
    players: m.players.map(p => ({ name: p.name, points: m.scores[p.id] })) };
  state.history.push(record);
  m.players.forEach(pm => {
    const p = state.players.find(x=>x.id===pm.id); if(!p) return;
    p.games++; p.points += m.scores[pm.id];
    const bestThisMatch = Math.max(0, ...m.rounds.map(r => Object.values(r.results[pm.id]||{}).reduce((s,x)=>s+x.points,0)));
    p.bestRound = Math.max(p.bestRound||0, bestThisMatch);
  });
  saveAll(); clearMatch();
  if(state.arcadeLocal){
    arcadeGameEnded(m.scores);
  } else {
    state.screen = 'matchEnd'; state._lastRecord = record; render();
    confettiBurst(40);
  }
}

function renderPregTurnLocal(app){

          </div>
          <div class="ans-desc" id="preg-exp-${i}" style="display:none;margin-top:8px;padding-left:0"></div>
        </div>`).join('')}

      <button class="btn btn-primary btn-lg btn-block" style="margin-top:8px" onclick="submitPregTurn()">✅ Terminé</button>
    </div>`;
}
let pregTurnAnswers = {}; let pregTurnSubmitted = false; let pregTurnTimer = null;
function pregChoose(qi, oi){
  if(pregTurnSubmitted || pregTurnAnswers[qi]!=null) return;
  pregTurnAnswers[qi] = oi;
  const q = state.pregMatch.questions[qi];
  const correct = oi === q.a;
  q.opts.forEach((_,x)=>{
    const b = document.getElementById('preg-opt-'+qi+'-'+x); if(!b) return;
    b.disabled = true;
    if(x===q.a) b.classList.add('trivia-correct');
    else if(x===oi) b.classList.add('trivia-wrong');
  });
  const expEl = document.getElementById('preg-exp-'+qi);
  if(expEl && q.exp){ expEl.textContent = (correct?'✅ ':'💡 ')+q.exp; expEl.style.display = 'block'; }
  beep(correct?880:220, correct?0.12:0.18, 0);
}
function beginPregTurnTimer(){
  const secs = state.settings.seconds || 90;
  pregTurnSubmitted = false;
  if(secs===0) return;
  const endsAt = Date.now() + secs*1000;
  clearInterval(pregTurnTimer);
  const tick = ()=>{
    const disp = document.getElementById('preg-timer-display'); const bar = document.getElementById('preg-timer-bar');
    if(!disp){ clearInterval(pregTurnTimer); return; }
    const remaining = Math.max(0, Math.ceil((endsAt-Date.now())/1000));
    disp.textContent = remaining; bar.style.width = (remaining/secs*100)+'%'; disp.classList.toggle('low', remaining<=10);
    if(remaining===3) soundCountdown();
    if(remaining<=0){ clearInterval(pregTurnTimer); soundEnd(); submitPregTurn(); }
  };
  pregTurnTimer = setInterval(tick, 250); tick();
}
function submitPregTurn(){
  if(pregTurnSubmitted) return;
  pregTurnSubmitted = true;
  clearInterval(pregTurnTimer);
  const m = state.pregMatch; const player = m.players[m.turnIndex];
  let correct = 0;
  m.questions.forEach((q,i)=>{ if(pregTurnAnswers[i]===q.a) correct++; });
  const points = correct * PREG_POINTS_PER_CORRECT;
  m.scores[player.id] = (m.scores[player.id]||0) + points;
  m.rounds.push({ playerId: player.id, correct, total: m.questions.length, points });
  m.turnIndex++;
  if(m.turnIndex < m.players.length){ state.screen = 'pregTurnLocal'; render(); }
  else endPregLocalMatch();
}
function endPregLocalMatch(){
  const m = state.pregMatch;
  const record = { id: uid(), date: Date.now(), mode:'local', game:'preguntados', rounds: m.rounds,
    players: m.players.map(p=>({name:p.name, points:m.scores[p.id]})) };
  state.history.push(record);
  m.players.forEach(pm => { const p = state.players.find(x=>x.id===pm.id); if(!p) return; p.games++; p.points += m.scores[pm.id]; });
  saveAll();
  state.pregMatch = null;
  if(state.arcadeLocal){
    arcadeGameEnded(m.scores);
  } else {
    state.screen = 'matchEnd'; state._lastRecord = record; render();
    confettiBurst(40);
  }
}

let peerLoaded = null;
function loadPeerJS(){
  if(peerLoaded) return peerLoaded;
  peerLoaded = new Promise((resolve,reject)=>{
    if(window.Peer) return resolve();
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error('no se pudo cargar PeerJS'));
    document.head.appendChild(s);
  });
  return peerLoaded;
}
function randCode(){ const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }

// -------- HOST --------
function hostCreateRoom(){
  const name = document.getElementById('oh-name').value.trim() || 'Anfitrión';
  toast('Conectando...');
  loadPeerJS().then(()=>{
    const code = randCode();
    const peer = new Peer('ftf-host-'+code);
    state.online = { role:'host', code, peer, name, conns: {}, guests: {}, deckName:'Clásico', deck:[...PRESETS['Clásico']],
      usedLetters: [], scores:{me:0}, myName:name, round:null, roundNum:0, history:[], awaitingAnswers:false,
      chatLog: [], chatOpen:false, chatUnread:0,
      arcade: { enabled:['tuttifruti','preguntados'], played:[], current:null, scoreboard:{} },
      pregRound:null, pregAwaiting:false, myPregAnswers:null,
      roster: [], myStream: null, videoConns: {}, remoteStreams: {} };
    peer.on('open', ()=>{ nav('onlineLobbyHost'); showChatFab(); showVideoFab(); hostBroadcastRoster(); });
    peer.on('error', err => { console.error(err); toast('Error de conexión: '+err.type); });
    peer.on('call', call => {
      const stream = state.online && state.online.myStream;
      call.answer(stream || undefined);
      registerVideoCall(call.peer, call);
    });
    peer.on('connection', conn => {
      conn.on('open', ()=>{});
      conn.on('data', data => handleHostMessage(conn, data));
      conn.on('close', ()=>{
        if(!state.online) return;
        delete state.online.conns[conn.peer]; delete state.online.guests[conn.peer];
        closeVideoConn(conn.peer);
        hostBroadcastRoster();
        maybeFinishRoundHost();
        maybeFinishPregRoundHost();
        maybeSkipAhorcadoTurn(conn.peer);
        maybeSkipEnglishTurn(conn.peer);
        if(state.screen==='onlineLobbyHost' || state.screen==='onlineWaiting' || state.screen==='onlinePregWaiting') render();
      });
      state.online.conns[conn.peer] = conn;
    });
  }).catch(e=>toast('No se pudo cargar el modo online'));
}
function hostBroadcast(obj){
  Object.values(state.online.conns).forEach(c => { try{ c.send(obj); }catch(e){} });
}
let hostResendTimer = null;
function hostBroadcastPersistent(obj){
  const o = state.online;
  if(!o) return;
  o.lastCriticalBroadcast = obj;
  hostBroadcast(obj);
  clearInterval(hostResendTimer);
  const startedAt = Date.now();
  hostResendTimer = setInterval(()=>{
    const oo = state.online;
    if(!oo || oo.role!=='host' || oo.lastCriticalBroadcast!==obj || Date.now()-startedAt>30000){ clearInterval(hostResendTimer); return; }
    hostBroadcast(obj);
  }, 3000);
}
function hostCancelPersistentBroadcast(){
  if(state.online) state.online.lastCriticalBroadcast = null;
  clearInterval(hostResendTimer);
}
function handleHostMessage(conn, data){
  const o = state.online;
  if(data.type==='join'){
    o.guests[conn.peer] = { name: data.name || 'Jugador', answers:null };
    hostBroadcastRoster();
    if(state.screen==='onlineLobbyHost') render();
  } else if(data.type==='answers'){
    if(o.awaitingAnswers && data.roundNum===o.roundNum && o.guests[conn.peer]){
      o.guests[conn.peer].answers = data.answers;
      maybeFinishRoundHost();
    }
  } else if(data.type==='basta'){
    if(o.round) hostStopRoundForAll(false);
  } else if(data.type==='pregAnswers'){
    if(o.pregAwaiting && o.pregRound && data.roundNum===o.pregRound.roundNum && o.guests[conn.peer]){
      o.guests[conn.peer].pregAnswers = data.answers;
      maybeFinishPregRoundHost();
    }
  } else if(data.type==='ahorcadoResult'){
    const g = o.ahorcado;
    if(g && g.order[g.turnIdx]===conn.peer){ g.deltas[conn.peer] = data.points; hostAhorcadoNextTurn(); }
  } else if(data.type==='englishResult'){
    const g = o.english;
    if(g && g.order[g.turnIdx]===conn.peer){ g.deltas[conn.peer] = data.points; hostEnglishNextTurn(); }
  } else if(data.type==='chat'){
    addChatMessage(data);
    chatBroadcastRelay(conn, data);
  }
}

function hostStartRound(){

// -------- PREGUNTADOS ONLINE (mismas conexiones de la sala, corrección automática) --------
function hostStartPreguntados(){
  const o = state.online;
  hostCancelPersistentBroadcast();
  const n = Math.min(PREG_QUESTIONS_PER_MATCH, PREGUNTADOS_BANK.length);
  const questions = pregDrawQuestions(n);
  o.roundNum++;
  Object.values(o.guests).forEach(g=>g.pregAnswers=null);
  o.myPregAnswers = null;
  o.pregAwaiting = true;
  const secs = state.settings.seconds || 90;
  o.pregRound = { questions, seconds: secs, roundNum: o.roundNum, localEndsAt: Date.now() + 1000 + secs*1000 };
  // se manda 'a' y 'exp' también: el objetivo de Preguntados es aprender, así que cada uno
  // ve la respuesta correcta y la explicación apenas contesta su propia pregunta
  const guestQuestions = questions.map(q => ({ q:q.q, opts:q.opts, cat:q.cat, a:q.a, exp:q.exp }));
  hostBroadcast({ type:'pregStart', questions:guestQuestions, seconds:secs, roundNum:o.roundNum });
  state.screen = 'onlinePregPlaying'; render();
}
function maybeFinishPregRoundHost(){
  const o = state.online;
  if(!o || !o.pregAwaiting) return;
  const allIn = o.myPregAnswers && Object.values(o.guests).every(g=>g.pregAnswers);
  if(allIn){ o.pregAwaiting = false; finishPregRoundHost(); return; }
  if(o.myPregAnswers && state.screen!=='onlinePregWaiting'){ state.screen='onlinePregWaiting'; render(); }
}
function finishPregRoundHost(){
  const o = state.online; const r = o.pregRound;
  const scoreFor = answers => { let c=0; r.questions.forEach((q,i)=>{ if(answers && answers[i]===q.a) c++; }); return c*PREG_POINTS_PER_CORRECT; };
  const deltas = { me: scoreFor(o.myPregAnswers) };
  Object.entries(o.guests).forEach(([pid,g])=>{ deltas[pid] = scoreFor(g.pregAnswers); });
  o.pregRound = null; o.pregAwaiting = false;
  arcadeGameEnded(deltas);
}
