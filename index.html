<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Frigurso Tutti Fruti</title>
<meta name="theme-color" content="#0b1220">
<meta name="description" content="El Tutti Fruti más completo: local o multijugador online con cualquiera">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain;height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;min-height:100dvh;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
:root{
  --bg:#0b1220;--card:#111a2e;--card2:#0e1626;--border:#1e2b47;
  --text:#e8edf7;--text2:#9fb0cc;--text3:#63739a;
  --accent:#FF7A29;--accent2:#8BC34A;--accent3:#5FB0E8;
  --danger:#ef4444;--ok:#22c55e;--warn:#F7D046;
}
button,input,select,textarea{font-family:inherit;color:inherit}
input,select,textarea{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:11px 12px;font-size:15px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{cursor:pointer;border:none;background:none}
.btn{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px;color:var(--text)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#ff9d5c);color:#1a0d00}
.btn-block{width:100%}
.btn-lg{padding:16px 20px;font-size:16px;border-radius:14px}
.btn-danger{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text2)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px}
.row{display:flex;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1}
.center{text-align:center}
.muted{color:var(--text3)}
.sub{color:var(--text2);font-size:13px}

.topbar{padding:18px 16px 10px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:19px;font-weight:800}
.topbar .sub{font-size:12px;margin-top:1px}
.topbar-icon{margin-left:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px}

.screen{padding:0 16px 24px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{font-size:14px;font-weight:700;margin-bottom:10px}
.card h3 .n{color:var(--text3);font-weight:500}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
.chip .x{color:var(--text3);font-size:13px;cursor:pointer;padding:0 2px}
.avatar{width:22px;height:22px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#06131f;flex-shrink:0}

.cta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.cta{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px 14px;text-align:center}
.cta .ic{font-size:32px;margin-bottom:8px;display:block}
.cta .t{font-weight:800;font-size:14px}
.cta .d{font-size:11px;color:var(--text3);margin-top:3px}
.cta.wide{grid-column:1/-1;display:flex;align-items:center;text-align:left;gap:14px}
.cta.wide .ic{margin:0;font-size:30px}

.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.kpi b{display:block;font-size:20px;font-weight:800;color:var(--accent)}
.kpi span{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.03em}

.nav-bottom{position:fixed;left:0;right:0;bottom:0;z-index:500;background:var(--card);border-top:1px solid var(--border);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:10px;color:var(--text3);font-size:10px;font-weight:700}
.nav-btn.active{color:var(--accent)}
.nav-btn .ni{font-size:19px}

.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:600}
.seg{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:8px;font-size:12px;font-weight:700;color:var(--text3)}
.seg button.active{background:var(--accent);color:#1a0d00}

.letter-badge{width:88px;height:88px;border-radius:22px;background:linear-gradient(135deg,var(--accent),#ff9d5c);
  display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#1a0d00;margin:0 auto 14px;
  box-shadow:0 8px 24px rgba(255,122,41,.35)}
.timer{font-size:34px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin-bottom:4px}
.timer.low{color:var(--danger)}
.timerbar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-bottom:18px}
.timerbar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}

.cat-input{margin-bottom:10px}
.cat-input label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:700}
.cat-input .dot{width:8px;height:8px;border-radius:99px;flex-shrink:0}
.cat-input input{font-size:16px;text-transform:capitalize}

.handoff{position:fixed;inset:0;z-index:600;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.handoff .ic{font-size:56px;margin-bottom:16px}
.handoff h2{font-size:20px;margin-bottom:6px}

.correct-cat{border-bottom:1px solid var(--border);padding:12px 0}
.correct-cat:last-child{border-bottom:none}
.correct-cat h4{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.ans-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.ans-row .name{width:76px;flex-shrink:0;font-size:12px;color:var(--text2);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ans-row .txt{flex:1;font-size:14px;font-weight:600}
.ans-row .txt.empty{color:var(--text3);font-style:italic;font-weight:400}
.status-btn{border-radius:8px;padding:5px 9px;font-size:11px;font-weight:700;border:1px solid var(--border);flex-shrink:0}
.status-btn.ok{background:rgba(34,197,94,.15);color:var(--ok);border-color:rgba(34,197,94,.3)}
.status-btn.rep{background:rgba(247,208,70,.15);color:var(--warn);border-color:rgba(247,208,70,.3)}
.status-btn.bad{background:rgba(239,68,68,.12);color:var(--danger);border-color:rgba(239,68,68,.3)}
.status-btn.rev{background:rgba(95,176,232,.15);color:var(--accent3);border-color:rgba(95,176,232,.3)}
.ans-desc{font-size:11px;color:var(--text3);margin:-2px 0 8px;padding-left:84px;line-height:1.4}
.pts{width:34px;text-align:right;flex-shrink:0;font-size:12px;font-weight:800;color:var(--text3)}

.score-list{display:flex;flex-direction:column;gap:8px}
.score-item{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.score-item .pos{width:20px;font-size:12px;color:var(--text3);font-weight:800}
.score-item .nm{flex:1;font-weight:700;font-size:14px}
.score-item .pt{font-weight:800;color:var(--accent);font-size:16px}
.score-item.first{border-color:rgba(255,122,41,.5);background:rgba(255,122,41,.08)}

.deck-cat{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:7px}
.deck-cat span{flex:1;font-size:14px}
.letters-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.letter-tog{aspect-ratio:1;border-radius:9px;background:var(--card2);border:1px solid var(--border);font-weight:800;font-size:13px;color:var(--text3)}
.letter-tog.on{background:var(--accent);color:#1a0d00;border-color:var(--accent)}

.room-code{font-size:38px;font-weight:800;letter-spacing:.12em;text-align:center;color:var(--accent);
  background:var(--card2);border:1px dashed var(--border);border-radius:14px;padding:16px;margin:14px 0}
.lobby-player{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:10px 12px;margin-bottom:7px}
.pulse{width:8px;height:8px;border-radius:99px;background:var(--ok);flex-shrink:0;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.empty-state{text-align:center;padding:40px 16px;color:var(--text3)}
.empty-state .ic{font-size:38px;margin-bottom:10px;display:block;opacity:.6}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:900;
  box-shadow:0 6px 20px rgba(0,0,0,.3)}

/* ═══════════════════════════════════════════════════════════════
   IDENTIDAD FRIGURSO — splash (puro CSS, se va solo) + traba de
   privacidad simple (contraseña, no cifra datos). Bloque copiado
   del patrón ya usado en el resto del portafolio.
   ═══════════════════════════════════════════════════════════════ */
#fg-splash{
  position:fixed;inset:0;z-index:9000;background:#0b1220;
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  animation:fg-splash-out .6s ease 2.8s forwards;
}
.fg-sash{
  position:absolute;width:130vw;height:22vh;max-height:170px;
  background:linear-gradient(90deg,#d7263d 0%,#d7263d 92%,#5fb0e8 100%);
  transform:rotate(-22deg) translateX(-140vw);top:46%;left:0;margin-top:-11vh;
  box-shadow:0 0 60px rgba(215,38,61,.3);
  animation:fg-sash-sweep 1.3s cubic-bezier(.16,.8,.24,1) both;
}
@keyframes fg-sash-sweep{0%{transform:rotate(-22deg) translateX(-140vw);}55%{transform:rotate(-22deg) translateX(0);}100%{transform:rotate(-22deg) translateX(0);}}
@keyframes fg-splash-out{to{opacity:0;pointer-events:none;visibility:hidden;}}
.fg-wordmark{
  position:relative;z-index:5;font-weight:800;font-stretch:condensed;
  font-size:min(11vw,42px);letter-spacing:.02em;
  color:#f5f7fa;text-transform:uppercase;
  opacity:0;transform:translateY(10px);animation:fg-word-in .5s ease .85s both;
}
@keyframes fg-word-in{to{opacity:1;transform:translateY(0);}}
.fg-tagline{
  position:relative;z-index:5;font-family:monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:#9fb0cc;margin-top:8px;
  opacity:0;animation:fg-word-in .5s ease 1.05s both;
}
#fg-lock{position:fixed;inset:0;z-index:8000;background:#0b1220;display:flex;align-items:center;justify-content:center;padding:24px;}
.fg-lock-card{width:100%;max-width:380px;}
.fg-lock-brand{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:30px;font-weight:800;font-stretch:condensed;font-size:15px;letter-spacing:.04em;color:#9fb0cc;text-transform:uppercase;}
.fg-lock-brand .dot{width:9px;height:9px;border-radius:2px;background:#d7263d;transform:rotate(45deg);flex-shrink:0;}
.fg-lock-title{font-size:14px;font-weight:700;margin-bottom:4px;color:#e8edf7;}
.fg-lock-sub{font-size:12px;color:#63739a;margin-bottom:16px;}
.fg-card{background:#111a2e;border:1px solid #1e2b47;border-radius:12px;padding:20px;}
.fg-card label{display:block;font-size:12px;color:#9fb0cc;margin-bottom:6px;}
.fg-card input{width:100%;background:#0e1626;border:1px solid #1e2b47;border-radius:9px;padding:11px 12px;color:#e8edf7;font-size:14px;box-sizing:border-box;}
.fg-card .field{margin-bottom:14px;}
.fg-card .btn-block{width:100%;border:none;border-radius:12px;padding:12px 18px;font-weight:700;font-size:13px;background:linear-gradient(135deg,#2dd4bf,#3b82f6);color:#06131f;cursor:pointer;}
.fg-err{color:#ef4444;font-size:12px;margin:-4px 0 10px;display:none;}
.fg-switch{text-align:center;margin-top:16px;font-size:12px;color:#63739a;}
.fg-switch a{color:#2dd4bf;cursor:pointer;text-decoration:underline;}
@media (prefers-reduced-motion: reduce){
  .fg-sash{animation:none;transform:rotate(-22deg) translateX(0);}
  .fg-wordmark,.fg-tagline{animation:none;opacity:1;transform:none;}
  #fg-splash{animation-delay:.1s;}
}
</style>
</head>
<body>

<div id="fg-splash" aria-hidden="true">
  <div class="fg-sash"></div>
  <div class="fg-wordmark">Frigurso</div>
  <div class="fg-tagline">Tutti Fruti</div>
</div>

<div id="fg-lock">
  <div class="fg-lock-card">
    <div class="fg-lock-brand"><div class="dot"></div><span>Frigurso</span></div>

    <div id="lk-crear" class="fg-card" style="display:block;">
      <div class="fg-lock-title">Creá tu acceso</div>
      <div class="fg-lock-sub">Es solo para que nadie más abra la app desde este celular. No cifra los datos.</div>
      <div class="field"><label>Contraseña (mínimo 4 caracteres)</label><input type="password" id="lk-pass" placeholder="••••••••"></div>
      <div class="field"><label>Repetir contraseña</label><input type="password" id="lk-pass2" placeholder="••••••••"></div>
      <div class="fg-err" id="lk-crear-err"></div>
      <button class="btn-block" onclick="fgCrearAcceso()">Crear y entrar</button>
    </div>

    <div id="lk-ingresar" class="fg-card" style="display:none;">
      <div class="fg-lock-title">Ingresá tu contraseña</div>

      <div class="fg-err" id="lk-ing-err"></div>
      <button class="btn-block" onclick="fgIngresarAcceso()">Ingresar</button>
      <div class="fg-switch"><a onclick="fgOlvideAcceso()">Olvidé mi contraseña</a></div>
    </div>
  </div>
</div>

<div id="app"></div>

<nav class="nav-bottom" id="bottomnav">
  <button class="nav-btn active" id="nav-home" onclick="nav('home')"><span class="ni">🏠</span><span>Inicio</span></button>
  <button class="nav-btn" id="nav-jugadores" onclick="nav('jugadores')"><span class="ni">👥</span><span>Jugadores</span></button>
  <button class="nav-btn" id="nav-mazos" onclick="nav('mazos')"><span class="ni">🃏</span><span>Mazos</span></button>
  <button class="nav-btn" id="nav-historial" onclick="nav('historial')"><span class="ni">📊</span><span>Historial</span></button>
  <button class="nav-btn" id="nav-config" onclick="nav('config')"><span class="ni">⚙️</span><span>Ajustes</span></button>
</nav>

<script>
/* ═══════════════════════════════════════════════════════════════
   DATA / STORAGE
   ═══════════════════════════════════════════════════════════════ */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const PRESETS = {
  'Clásico': ['Nombre','Apellido','Animal','Fruta o verdura','Color','País','Ciudad','Objeto','Marca','Comida o bebida','Película o serie','Profesión u oficio'],
  'Para chicos': ['Animal','Color','Fruta','Juguete','Personaje de dibujitos','Comida'],
  'Geografía': ['País','Ciudad','Río o lago','Montaña','Capital','Provincia o estado'],
  'Cultura pop': ['Película','Serie','Cantante o banda','Videojuego','Personaje ficticio','Canción'],
  'Picante': ['Insulto (sano)','Excusa para faltar al trabajo','Cosa que no le prestarías a nadie','Cosa que hacés en el baño','Sobrenombre','Cosa que se rompe fácil'],
};

const AVATAR_COLORS = ['#FF7A29','#8BC34A','#5FB0E8','#F7D046','#D7263D','#a78bfa','#22c55e','#f472b6'];
const ALL_LETTERS = 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('');
const DEFAULT_LETTERS_OFF = ['K','W','X'];

function defaultSettings(){
  const letters = {}; ALL_LETTERS.forEach(l => letters[l] = !DEFAULT_LETTERS_OFF.includes(l));
  return { seconds: 90, scoreUnique: 100, scoreRepeated: 50, scoreEmpty: 0, letters };
}

const state = {
  screen: 'home',
  players: LS.get('ftf_players', []),
  decks: LS.get('ftf_decks', {}),
  settings: LS.get('ftf_settings', defaultSettings()),
  history: LS.get('ftf_history', []),
  match: LS.get('ftf_match_inprogress', null),
  setup: null,
  online: null,
};

function saveAll(){
  LS.set('ftf_players', state.players);
  LS.set('ftf_decks', state.decks);
  LS.set('ftf_settings', state.settings);
  LS.set('ftf_history', state.history);
}
function saveMatch(){ LS.set('ftf_match_inprogress', state.match); }
function clearMatch(){ state.match = null; localStorage.removeItem('ftf_match_inprogress'); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const MIN_WORD_LEN = 2;
const wordLookupCache = new Map();
function fetchWithTimeout(url, ms){
  return Promise.race([
    fetch(url),
    new Promise(resolve => setTimeout(()=>resolve(null), ms))
  ]).catch(()=>null);
}
async function lookupWord(word){
  const key = normalize(word);
  if(!key) return { checked:true, found:false, desc:null };
  if(wordLookupCache.has(key)) return wordLookupCache.get(key);
  let checked = false, found = false, desc = null;
  try{
    const r = await fetchWithTimeout('https://es.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(word.trim().replace(/\s+/g,'_')), 4000);
    if(r){
      checked = true;
      if(r.ok){
        const data = await r.json();
        if(data && data.extract && data.type !== 'disambiguation'){ found = true; desc = data.extract.split('\n')[0].slice(0,220); }
      }
    }
  }catch(e){}
  if(!found){
    try{
      const url = 'https://es.wiktionary.org/w/api.php?action=query&titles='+encodeURIComponent(word.trim())+'&prop=extracts&exintro=1&explaintext=1&format=json&origin=*&redirects=1';
      const r = await fetchWithTimeout(url, 4000);
      if(r){
        checked = true;
        if(r.ok){
          const data = await r.json();
          const pages = (data && data.query && data.query.pages) || {};
          const page = Object.values(pages)[0];
          if(page && page.pageid){
            found = true;
            const lines = (page.extract||'').split('\n').map(s=>s.trim()).filter(Boolean);
            desc = lines[0] ? lines[0].slice(0,220) : null;
          }
        }
      }
    }catch(e){}
  }
  const result = { checked, found, desc };
  wordLookupCache.set(key, result);
  return result;
}
async function computeResults(deck, players, letter){
  const results = {};
  const lookups = new Map();
  const toCheck = new Set();
  deck.forEach(cat => players.forEach(p => {
    const text = (p.answers||{})[cat] || '';
    if(text.trim().length>=MIN_WORD_LEN && startsWithLetter(text, letter)) toCheck.add(text.trim());
  }));
  await Promise.all([...toCheck].map(async w => { lookups.set(normalize(w), await lookupWord(w)); }));
  deck.forEach(cat => {
    const perPlayer = players.map(p => ({ id:p.id, text: (p.answers||{})[cat] || '' }));
    const counts = {};
    perPlayer.forEach(a => { const n = normalize(a.text); if(n) counts[n] = (counts[n]||0)+1; });
    perPlayer.forEach(a => {
      const n = normalize(a.text);
      let status, pts, desc=null;
      if(!n || a.text.trim().length<MIN_WORD_LEN){ status='bad'; pts=state.settings.scoreEmpty; }
      else if(!startsWithLetter(a.text, letter)){ status='bad'; pts=state.settings.scoreEmpty; }
      else {
        const lk = lookups.get(n) || { checked:false, found:false, desc:null };
        desc = lk.desc;
        if(lk.checked && !lk.found){ status='rev'; pts=state.settings.scoreEmpty; }
        else if(counts[n]>1){ status='rep'; pts=state.settings.scoreRepeated; }
        else { status='ok'; pts=state.settings.scoreUnique; }
      }
      if(!results[a.id]) results[a.id] = {};
      results[a.id][cat] = { text: a.text, status, points: pts, desc };
    });
  });
  return results;
}
function normalize(s){
  return String(s||'').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,' ');
}
function startsWithLetter(text, letter){

/* ═══════════════════════════════════════════════════════════════
   SOUND — beep generado, sin archivos externos
   ═══════════════════════════════════════════════════════════════ */
let audioCtx = null;
function beep(freq, dur, delay){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + (delay||0);
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.25, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur+0.05);
  }catch(e){}
}
function soundCountdown(){ beep(880,0.1,0); beep(880,0.1,0.35); beep(880,0.1,0.7); }
function soundEnd(){ beep(440,0.5,0); beep(660,0.6,0.15); }

function drawNextLetter(){
  const m = state.match;
  let pool = ALL_LETTERS.filter(l => state.settings.letters[l] && !m.usedLetters.includes(l));
  if(pool.length===0){ m.usedLetters = []; pool = ALL_LETTERS.filter(l => state.settings.letters[l]); }
  m.currentLetter = pool[Math.floor(Math.random()*pool.length)];
  m.usedLetters.push(m.currentLetter);
  m.turnIndex = 0; m.roundAnswers = {};
  saveMatch();
}

    </div>`;

let turnSubmitted = false;
let turnCountdownPlayed = false;
function beginTurnTimer(){
  const secs = state.settings.seconds;
  turnSubmitted = false;
  if(secs===0) return;
  turnCountdownPlayed = false;
  const endsAt = Date.now() + secs*1000;
  clearInterval(turnTimer);
  const tick = ()=>{
    const disp = document.getElementById('timer-display'); const bar = document.getElementById('timer-bar');
    if(!disp){ clearInterval(turnTimer); return; }
    const remaining = Math.max(0, Math.ceil((endsAt - Date.now())/1000));
    disp.textContent = remaining;
    bar.style.width = (remaining/secs*100)+'%';
    disp.classList.toggle('low', remaining<=10);
    if(remaining<=3 && remaining>0 && !turnCountdownPlayed){ turnCountdownPlayed = true; soundCountdown(); }
    if(remaining<=0){ clearInterval(turnTimer); soundEnd(); submitTurn(); }
  };
  turnTimer = setInterval(tick, 250);
  tick();
}
function submitTurn(){
  if(turnSubmitted) return;
  turnSubmitted = true;
  clearInterval(turnTimer);
  const m = state.match; const player = m.players[m.turnIndex];
  const answers = {};
  m.deck.forEach((c,i)=>{ const el = document.getElementById('ci-'+i); answers[c] = el ? el.value.trim() : ''; });
  m.roundAnswers[player.id] = answers;
  m.turnIndex++;
  saveMatch();
  if(m.turnIndex < m.players.length){ startTurn(); }
  else { enterCorrectionLocal(); }
}

function enterCorrectionLocal(){
  const m = state.match;
  state.screen = 'correctionLocal';
  m._results = null;
  render();
  const players = m.players.map(p => ({ id:p.id, answers: m.roundAnswers[p.id]||{} }));
  computeResults(m.deck, players, m.currentLetter).then(results => {
    if(state.match !== m) return;
    m._results = results; saveMatch();
    if(state.screen==='correctionLocal') render();
  });
}
const STATUS_LABEL = { ok:'Válida', rep:'Repetida', bad:'Inválida', rev:'¿Existe?' };
function renderCorrectionLocal(app){
  const m = state.match;
  if(!m._results){
    app.innerHTML = `${topbar('Corrigiendo respuestas', 'Buscando cada palabra en el diccionario...')}
      <div class="screen center" style="padding-top:60px"><div style="font-size:40px">📖</div></div>`;
    return;
  }
  const results = m._results;
  app.innerHTML = `
    ${topbar('Corrección — letra '+m.currentLetter, 'Tocá una respuesta para cambiar su estado')}
    <div class="screen">
      ${m.deck.map(cat => `
        <div class="correct-cat"><h4>${esc(cat)}</h4>
          ${m.players.map(p => {
            const r = (results[p.id]||{})[cat] || {text:'',status:'bad',points:state.settings.scoreEmpty,desc:null};
            return `<div class="ans-row">
              <span class="name">${esc(p.name)}</span>
              <span class="txt ${r.text?'':'empty'}">${r.text?esc(r.text):'(vacío)'}</span>
              <button class="status-btn ${r.status}" onclick="cycleStatus('${p.id}','${cat.replace(/'/g,"\\'")}')">${STATUS_LABEL[r.status]||r.status}</button>
              <span class="pts">${r.points}</span>
            </div>
            ${r.desc ? `<div class="ans-desc">${esc(r.desc)}</div>` : (r.status==='rev' ? `<div class="ans-desc">No la encontramos en el diccionario — revisala a mano.</div>` : '')}`;
          }).join('')}
        </div>`).join('')}
      <button class="btn btn-primary btn-lg btn-block" style="margin-top:16px" onclick="confirmRoundScore()">Confirmar puntaje de la ronda</button>
    </div>`;
}
function cycleStatus(playerId, cat){
  const results = state.screen==='onlineReview' ? state.online.reviewResults : state.match._results;
  const r = results[playerId][cat];
  const order = ['ok','rep','bad']; const next = order[(order.indexOf(r.status)+1)%order.length];
  r.status = next;
  r.points = next==='ok' ? state.settings.scoreUnique : next==='rep' ? state.settings.scoreRepeated : state.settings.scoreEmpty;
  render();
}
function confirmRoundScore(){
  const m = state.match; const results = m._results;
  m.players.forEach(p => {
    const total = Object.values(results[p.id]||{}).reduce((s,r)=>s+r.points,0);
    m.scores[p.id] = (m.scores[p.id]||0) + total;
  });
  m.rounds.push({ letter: m.currentLetter, results });
  m.currentLetter = null; m._results = null;
  saveMatch();
  state.screen = 'roundScoreboard'; render();
}

function endLocalMatch(){
  const m = state.match;
  const record = { id: uid(), date: Date.now(), mode: 'local', rounds: m.rounds,
    players: m.players.map(p => ({ name: p.name, points: m.scores[p.id] })) };
  state.history.push(record);
  m.players.forEach(pm => {
    const p = state.players.find(x=>x.id===pm.id); if(!p) return;
    p.games++; p.points += m.scores[pm.id];
    const bestThisMatch = Math.max(0, ...m.rounds.map(r => Object.values(r.results[pm.id]||{}).reduce((s,x)=>s+x.points,0)));
    p.bestRound = Math.max(p.bestRound||0, bestThisMatch);
  });
  saveAll(); clearMatch();
  state.screen = 'matchEnd'; state._lastRecord = record; render();
}

let peerLoaded = null;
function loadPeerJS(){
  if(peerLoaded) return peerLoaded;
  peerLoaded = new Promise((resolve,reject)=>{
    if(window.Peer) return resolve();
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error('no se pudo cargar PeerJS'));
    document.head.appendChild(s);
  });
  return peerLoaded;
}
function randCode(){ const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }

function hostCreateRoom(){
  const name = document.getElementById('oh-name').value.trim() || 'Anfitrión';
  toast('Conectando...');
  loadPeerJS().then(()=>{
    const code = randCode();
    const peer = new Peer('ftf-host-'+code);
    state.online = { role:'host', code, peer, name, conns: {}, guests: {}, deckName:'Clásico', deck:[...PRESETS['Clásico']],
      usedLetters: [], scores:{me:0}, myName:name, round:null, roundNum:0, history:[], awaitingAnswers:false };
    peer.on('open', ()=>{ nav('onlineLobbyHost'); });
    peer.on('error', err => { console.error(err); toast('Error de conexión: '+err.type); });
    peer.on('connection', conn => {
      conn.on('open', ()=>{});
      conn.on('data', data => handleHostMessage(conn, data));
      conn.on('close', ()=>{ if(state.online){ delete state.online.conns[conn.peer]; delete state.online.guests[conn.peer]; if(state.screen==='onlineLobbyHost') render(); } });
      state.online.conns[conn.peer] = conn;
    });
  }).catch(e=>toast('No se pudo cargar el modo online'));
}
function hostBroadcast(obj){
  Object.values(state.online.conns).forEach(c => { try{ c.send(obj); }catch(e){} });
}
function handleHostMessage(conn, data){
  const o = state.online;
  if(data.type==='join'){
    o.guests[conn.peer] = { name: data.name || 'Jugador', answers:null };
    if(state.screen==='onlineLobbyHost') render();
  } else if(data.type==='answers'){
    if(o.awaitingAnswers && data.roundNum===o.roundNum && o.guests[conn.peer]){
      o.guests[conn.peer].answers = data.answers;
      maybeFinishRoundHost();
    }
  }
}

function hostStartRound(){
  const o = state.online;
  let pool = ALL_LETTERS.filter(l => state.settings.letters[l] && !o.usedLetters.includes(l));
  if(pool.length===0){ o.usedLetters=[]; pool = ALL_LETTERS.filter(l=>state.settings.letters[l]); }
  const letter = pool[Math.floor(Math.random()*pool.length)];
  o.usedLetters.push(letter);
  o.roundNum++;
  Object.values(o.guests).forEach(g=>g.answers=null);
  o.myAnswers = null;
  o.awaitingAnswers = true;
  const secs = state.settings.seconds || 90;
  o.round = { letter, deck: o.deck, seconds: secs, roundNum: o.roundNum, localEndsAt: Date.now() + 1000 + secs*1000 };

function maybeFinishRoundHost(){
  const o = state.online;
  if(!o.awaitingAnswers) return;

function finishRoundHost(){
  const o = state.online;

  o.reviewResults = null;
  state.screen = 'onlineReview'; render();

    if(!state.online || state.online!==o) return;

<script>
/* ═══════════════════════════════════════════════════════════════
   IDENTIDAD FRIGURSO — traba de privacidad simple, independiente del
   resto de la app. No cifra datos, solo tapa la vista hasta que se
   pone la contraseña. El desbloqueo es una acción del usuario, no
   un timer, así que si esto tarda en cargar el peor caso es que el
   botón no responda todavía — nunca queda trabado en silencio.
   ═══════════════════════════════════════════════════════════════ */
function fgErr(id, msg){ const el = document.getElementById(id); el.textContent = msg; el.style.display = 'block'; }
function fgHideErr(id){ document.getElementById(id).style.display = 'none'; }
async function _hashPass(pass){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pass));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function fgOcultarLock(){
  document.getElementById('fg-lock').style.display = 'none';
  try{ localStorage.setItem('ftf_unlocked','1'); }catch(e){}
}
function fgMostrarLock(){
  try{ localStorage.removeItem('ftf_unlocked'); }catch(e){}
  document.getElementById('lk-pass-in').value = '';
  fgHideErr('lk-ing-err');
  document.getElementById('fg-lock').style.display = 'flex';
}
async function fgCrearAcceso(){
  fgHideErr('lk-crear-err');
  const p1 = document.getElementById('lk-pass').value;
  const p2 = document.getElementById('lk-pass2').value;
  if(!p1 || p1.length<4){ fgErr('lk-crear-err','Mínimo 4 caracteres'); return; }
  if(p1!==p2){ fgErr('lk-crear-err','Las contraseñas no coinciden'); return; }
  localStorage.setItem('ftf_pass_hash', await _hashPass(p1));
  fgOcultarLock();
}
async function fgIngresarAcceso(){
  fgHideErr('lk-ing-err');
  const p = document.getElementById('lk-pass-in').value;
  if((await _hashPass(p)) === localStorage.getItem('ftf_pass_hash')){
    fgOcultarLock();
  } else {
    fgErr('lk-ing-err','Contraseña incorrecta');
  }
}
function fgOlvideAcceso(){
  if(!confirm('Vamos a borrar la contraseña de este celular para que puedas entrar de nuevo. Tus datos NO se borran.\n\n¿Continuar?')) return;
  localStorage.removeItem('ftf_pass_hash');
  location.reload();
}
if(new URLSearchParams(location.search).get('join')){
  // Invitado entrando por link de sala: no es Fernando, no pedimos su contraseña.
} else if(localStorage.getItem('ftf_pass_hash')){
  document.getElementById('lk-crear').style.display = 'none';
  document.getElementById('lk-ingresar').style.display = 'block';
  let yaDesbloqueado = false;
  try{ yaDesbloqueado = localStorage.getItem('ftf_unlocked') === '1'; }catch(e){}
  if(yaDesbloqueado) fgOcultarLock();
}
</script>
