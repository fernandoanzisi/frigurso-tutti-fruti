<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Frigurso Tutti Fruti</title>
<meta name="theme-color" content="#0b1220">
<meta name="description" content="El Tutti Fruti más completo: local o multijugador online con cualquiera">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain;height:100%}
body{
  background:
    radial-gradient(circle at 12% 6%, rgba(255,62,134,.14), transparent 40%),
    radial-gradient(circle at 92% 14%, rgba(0,207,193,.14), transparent 38%),
    radial-gradient(circle at 10% 62%, rgba(155,93,229,.10), transparent 40%),
    radial-gradient(circle at 50% 98%, rgba(255,159,28,.12), transparent 42%),
    var(--bg);
  color:var(--text);
  font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;min-height:100dvh;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  position:relative;overflow-x:hidden;
}
:root{
  --bg:#0b1220;--card:#111a2e;--card2:#0e1626;--border:#1e2b47;
  --text:#e8edf7;--text2:#9fb0cc;--text3:#63739a;
  --accent:#FF3E86;--accent2:#FF9F1C;--accent3:#00CFC1;
  --accent4:#FFD23F;--accent5:#6BCB3D;--accent6:#9B5DE5;
  --danger:#ef4444;--ok:#6BCB3D;--warn:#FFD23F;
  --f-display:'Fredoka',-apple-system,sans-serif;
}
button,input,select,textarea{font-family:inherit;color:inherit}
input,select,textarea{background:var(--card2);border:2px solid var(--border);border-radius:10px;padding:11px 12px;font-size:15px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,62,134,.18)}
button{cursor:pointer;border:none;background:none;font-family:inherit}
.btn{background:var(--card2);border:2px solid var(--border);border-radius:14px;padding:12px 16px;font-weight:800;font-size:14px;color:var(--text);
  box-shadow:0 3px 0 var(--border);transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--border)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 0 #c21d63}
.btn-primary:active{box-shadow:0 1px 0 #c21d63}
.btn-block{width:100%}
.btn-lg{padding:16px 20px;font-size:16px;border-radius:16px}
.btn-danger{background:rgba(239,68,68,.14);color:var(--danger);border:2px solid rgba(239,68,68,.35);box-shadow:0 3px 0 rgba(239,68,68,.22)}
.btn-danger:active{box-shadow:0 1px 0 rgba(239,68,68,.22)}
.btn-ghost{background:none;border:2px solid var(--border);color:var(--text2);box-shadow:none}
.btn-ghost:active{transform:translateY(2px)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:10px;box-shadow:0 2px 0 var(--border)}
.btn-sm:active{box-shadow:0 1px 0 var(--border)}
.row{display:flex;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1}
.center{text-align:center}
.muted{color:var(--text3)}
.sub{color:var(--text2);font-size:13px}

.topbar{padding:18px 16px 10px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:20px;font-weight:700;font-family:var(--f-display)}
.topbar .sub{font-size:12px;margin-top:1px}
.topbar-icon{margin-left:auto;background:var(--card);border:2px solid var(--border);border-radius:12px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px}

.screen{padding:0 16px 24px;max-width:640px;margin:0 auto;position:relative;z-index:1}
.card{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.card h3{font-size:14px;font-weight:800;margin-bottom:10px;font-family:var(--f-display)}
.card h3 .n{color:var(--text3);font-weight:500}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:2px solid var(--border);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700}
.chip .x{color:var(--text3);font-size:13px;cursor:pointer;padding:0 2px}
.avatar{width:22px;height:22px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#06131f;flex-shrink:0;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}

.cta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.cta{background:var(--card);border:2px solid var(--border);border-radius:20px;padding:20px 14px;text-align:center;
  box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .12s ease,box-shadow .12s ease}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.cta .ic{font-size:34px;margin-bottom:8px;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.cta .t{font-weight:800;font-size:14px;font-family:var(--f-display)}
.cta .d{font-size:11px;color:var(--text3);margin-top:3px}
.cta.wide{grid-column:1/-1;display:flex;align-items:center;text-align:left;gap:14px}
.cta.wide .ic{margin:0;font-size:30px}
.cta-grid .cta:nth-child(1){background:linear-gradient(160deg,rgba(255,62,134,.18),var(--card) 65%);border-color:rgba(255,62,134,.35)}
.cta-grid .cta:nth-child(2){background:linear-gradient(160deg,rgba(0,207,193,.18),var(--card) 65%);border-color:rgba(0,207,193,.35)}
.cta-grid .cta:nth-child(3){background:linear-gradient(160deg,rgba(255,159,28,.16),var(--card) 65%);border-color:rgba(255,159,28,.35)}

.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kpi{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:12px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.kpi b{display:block;font-size:22px;font-weight:700;color:var(--accent);font-family:var(--f-display)}
.kpi span{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.03em}
.kpi:nth-child(1) b{color:var(--accent)}
.kpi:nth-child(2) b{color:var(--accent2)}
.kpi:nth-child(3) b{color:var(--accent3)}

.nav-bottom{position:fixed;left:0;right:0;bottom:0;z-index:500;background:var(--card);border-top:2px solid var(--border);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:12px;color:var(--text3);font-size:10px;font-weight:700;transition:transform .12s ease,background .12s ease}
.nav-btn:active{transform:scale(.9)}
.nav-btn.active{color:var(--accent);background:rgba(255,62,134,.12)}
.nav-btn .ni{font-size:19px}

.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:700}
.seg{display:flex;background:var(--card2);border:2px solid var(--border);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:12px;font-weight:700;color:var(--text3);transition:transform .1s ease}
.seg button.active{background:var(--accent);color:#fff}
.seg button:active{transform:scale(.94)}

.letter-badge{width:92px;height:92px;border-radius:26px;
  background:linear-gradient(135deg,var(--accent),var(--accent2) 35%,var(--accent4) 60%,var(--accent5) 80%,var(--accent3));
  display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;font-family:var(--f-display);color:#fff;margin:0 auto 14px;
  text-shadow:0 2px 6px rgba(0,0,0,.3);
  box-shadow:0 8px 0 rgba(0,0,0,.2),0 10px 26px rgba(255,62,134,.35)}
.letter-badge.pop{animation:letterPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes letterPop{0%{transform:scale(.55) rotate(-10deg)}55%{transform:scale(1.18) rotate(5deg)}80%{transform:scale(.95) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
.timer{font-size:36px;font-weight:700;font-family:var(--f-display);text-align:center;font-variant-numeric:tabular-nums;margin-bottom:4px}
.timer.low{color:var(--danger);animation:timerShake .5s infinite}
@keyframes timerShake{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.timerbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-bottom:18px;border:1px solid var(--border)}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1s linear}

.cat-input{margin-bottom:10px;animation:riseIn .4s cubic-bezier(.16,.84,.44,1) both}
.cat-input label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:700}
.cat-input .dot{width:9px;height:9px;border-radius:99px;flex-shrink:0;box-shadow:inset 0 -1px 1px rgba(0,0,0,.3)}
.cat-input input{font-size:16px;text-transform:capitalize}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.handoff{position:fixed;inset:0;z-index:600;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.handoff .ic{font-size:56px;margin-bottom:16px;animation:float 2.4s ease-in-out infinite}
.handoff h2{font-size:20px;margin-bottom:6px;font-family:var(--f-display);font-weight:700}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}

.correct-cat{border-bottom:1px solid var(--border);padding:12px 0}
.correct-cat:last-child{border-bottom:none}
.correct-cat h4{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.ans-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.ans-row .name{width:76px;flex-shrink:0;font-size:12px;color:var(--text2);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ans-row .txt{flex:1;font-size:14px;font-weight:600}
.ans-row .txt.empty{color:var(--text3);font-style:italic;font-weight:400}
.status-btn{border-radius:9px;padding:5px 9px;font-size:11px;font-weight:800;border:2px solid var(--border);flex-shrink:0;transition:transform .1s ease}
.status-btn:active{transform:scale(.92)}
.status-btn.ok{background:rgba(107,203,61,.15);color:var(--ok);border-color:rgba(107,203,61,.4)}
.status-btn.rep{background:rgba(255,210,63,.15);color:var(--warn);border-color:rgba(255,210,63,.4)}
.status-btn.bad{background:rgba(239,68,68,.12);color:var(--danger);border-color:rgba(239,68,68,.4)}
.status-btn.rev{background:rgba(0,207,193,.15);color:var(--accent3);border-color:rgba(0,207,193,.4)}
.ans-desc{font-size:11px;color:var(--text3);margin:-2px 0 8px;padding-left:84px;line-height:1.4}
.pts{width:34px;text-align:right;flex-shrink:0;font-size:12px;font-weight:800;color:var(--text3)}

.trivia-opt{text-align:left;margin-bottom:0}
.trivia-correct{background:rgba(107,203,61,.18)!important;border-color:var(--ok)!important;color:var(--ok)!important}
.trivia-wrong{background:rgba(239,68,68,.15)!important;border-color:var(--danger)!important;color:var(--danger)!important}

.score-list{display:flex;flex-direction:column;gap:8px}
.score-item{display:flex;align-items:center;gap:10px;background:var(--card2);border:2px solid var(--border);border-radius:14px;padding:10px 12px;animation:riseIn .35s ease both}
.score-item .pos{width:20px;font-size:12px;color:var(--text3);font-weight:800}
.score-item .nm{flex:1;font-weight:700;font-size:14px}
.score-item .pt{font-weight:700;color:var(--accent);font-size:17px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.score-item.first{border-color:var(--accent4);background:rgba(255,210,63,.1);box-shadow:0 0 0 3px rgba(255,210,63,.15)}

.deck-cat{display:flex;align-items:center;gap:8px;background:var(--card2);border:2px solid var(--border);border-radius:11px;padding:9px 12px;margin-bottom:7px}
.deck-cat span{flex:1;font-size:14px}
.letters-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.letter-tog{aspect-ratio:1;border-radius:10px;background:var(--card2);border:2px solid var(--border);font-weight:800;font-size:13px;color:var(--text3);transition:transform .1s ease}
.letter-tog:active{transform:scale(.9)}
.letter-tog.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.room-code{font-size:40px;font-weight:700;font-family:var(--f-display);letter-spacing:.14em;text-align:center;color:var(--accent);
  background:var(--card2);border:2px dashed var(--accent);border-radius:16px;padding:16px;margin:14px 0}
.lobby-player{display:flex;align-items:center;gap:10px;background:var(--card2);border:2px solid var(--border);border-radius:13px;padding:10px 12px;margin-bottom:7px;animation:riseIn .35s ease both}
.pulse{width:8px;height:8px;border-radius:99px;background:var(--ok);flex-shrink:0;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.empty-state{text-align:center;padding:40px 16px;color:var(--text3)}
.empty-state .ic{font-size:44px;margin-bottom:10px;display:block;opacity:.75}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:800;z-index:900;
  box-shadow:0 6px 20px rgba(0,0,0,.3);animation:toastIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

.bg-blob{position:fixed;border-radius:50%;filter:blur(40px);pointer-events:none;z-index:0;opacity:.35;animation:blobDrift 26s ease-in-out infinite}
.bg-blob.b1{width:220px;height:220px;background:var(--accent);top:-60px;left:-60px}
.bg-blob.b2{width:180px;height:180px;background:var(--accent3);top:40%;right:-70px;animation-duration:31s;animation-delay:-6s}
.bg-blob.b3{width:200px;height:200px;background:var(--accent2);bottom:-70px;left:20%;animation-duration:28s;animation-delay:-12s}
.bg-blob.b4{width:150px;height:150px;background:var(--accent6);top:12%;right:20%;animation-duration:22s;animation-delay:-3s}
@keyframes blobDrift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(24px,-18px) scale(1.08)}66%{transform:translate(-18px,20px) scale(.94)}}

.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:950;overflow:hidden}
.confetti-wrap i{position:absolute;top:-24px;width:8px;height:14px;border-radius:2px;animation:confettiFall linear forwards;opacity:.95}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(600deg);opacity:0}}

.mascot{display:block;margin:0 auto;animation:float 3s ease-in-out infinite}

.chat-fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:960;
  width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  align-items:center;justify-content:center;font-size:24px;color:#fff;
  box-shadow:0 6px 0 #c21d63,0 10px 24px rgba(0,0,0,.35);border:none;cursor:pointer;transition:transform .12s ease}
.chat-fab:active{transform:translateY(3px) scale(.96)}
.chat-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;
  min-width:20px;height:20px;border-radius:99px;align-items:center;justify-content:center;padding:0 5px;
  border:2px solid var(--bg)}
.chat-panel{position:fixed;inset:0;z-index:970;background:rgba(6,10,20,.55);display:flex;align-items:flex-end;justify-content:center}
.chat-sheet{width:100%;max-width:640px;height:min(78vh,640px);background:var(--card);border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;border:2px solid var(--border);border-bottom:none;overflow:hidden;
  animation:chatSheetIn .28s cubic-bezier(.16,.84,.44,1) both}
@keyframes chatSheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
.chat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:2px solid var(--border);flex-shrink:0}
.chat-head h3{font-family:var(--f-display);font-size:15px;font-weight:700}
.chat-msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.chat-bub{max-width:78%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.35;position:relative;animation:riseIn .25s ease both;word-break:break-word}
.chat-bub .nm{font-size:11px;font-weight:800;margin-bottom:2px;opacity:.85}
.chat-bub .ts{font-size:10px;opacity:.55;margin-top:3px;text-align:right}
.chat-row{display:flex}
.chat-row.mine{justify-content:flex-end}
.chat-row.mine .chat-bub{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:4px}
.chat-row:not(.mine) .chat-bub{background:var(--card2);border:2px solid var(--border);border-bottom-left-radius:4px}
.chat-bub audio{width:200px;height:34px;max-width:100%}
.chat-sys{text-align:center;font-size:11px;color:var(--text3);margin:4px 0}
.chat-input-wrap{border-top:2px solid var(--border);padding:10px 12px;flex-shrink:0}
.chat-emojis{display:none;grid-template-columns:repeat(8,1fr);gap:4px;max-height:150px;overflow-y:auto;padding:8px 2px;border-bottom:1px solid var(--border);margin-bottom:8px}
.chat-emojis.show{display:grid}
.chat-emojis button{font-size:20px;padding:6px 0;border-radius:8px}
.chat-emojis button:active{background:var(--card2)}
.chat-input-row{display:flex;align-items:center;gap:6px}
.chat-input-row input{flex:1}
.chat-icon-btn{width:42px;height:42px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--card2);border:2px solid var(--border);color:var(--text2)}
.chat-icon-btn:active{transform:scale(.92)}
.chat-icon-btn.send{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.chat-icon-btn.rec.active{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.4);color:var(--danger);animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.chat-rec-indicator{display:flex;align-items:center;gap:8px;padding:8px 4px;font-size:13px;color:var(--danger);font-weight:700}
.chat-rec-indicator .dot{width:9px;height:9px;border-radius:99px;background:var(--danger);animation:pulse 1s infinite}

/* ═══════════════════════════════════════════════════════════════
   IDENTIDAD FRIGURSO — splash (puro CSS, se va solo) + traba de
   privacidad simple (contraseña, no cifra datos). Bloque copiado
   del patrón ya usado en el resto del portafolio.
   ═══════════════════════════════════════════════════════════════ */
#fg-splash{
  position:fixed;inset:0;z-index:9000;background:#0b1220;
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  animation:fg-splash-out .6s ease 2.8s forwards;
}
.fg-sash{
  position:absolute;width:130vw;height:22vh;max-height:170px;
  background:linear-gradient(90deg,#d7263d 0%,#d7263d 92%,#5fb0e8 100%);
  transform:rotate(-22deg) translateX(-140vw);top:46%;left:0;margin-top:-11vh;
  box-shadow:0 0 60px rgba(215,38,61,.3);
  animation:fg-sash-sweep 1.3s cubic-bezier(.16,.8,.24,1) both;
}
@keyframes fg-sash-sweep{0%{transform:rotate(-22deg) translateX(-140vw);}55%{transform:rotate(-22deg) translateX(0);}100%{transform:rotate(-22deg) translateX(0);}}
@keyframes fg-splash-out{to{opacity:0;pointer-events:none;visibility:hidden;}}
.fg-wordmark{
  position:relative;z-index:5;font-weight:800;font-stretch:condensed;
  font-size:min(11vw,42px);letter-spacing:.02em;
  color:#f5f7fa;text-transform:uppercase;
  opacity:0;transform:translateY(10px);animation:fg-word-in .5s ease .85s both;
}
@keyframes fg-word-in{to{opacity:1;transform:translateY(0);}}
.fg-tagline{
  position:relative;z-index:5;font-family:monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:#9fb0cc;margin-top:8px;
  opacity:0;animation:fg-word-in .5s ease 1.05s both;
}

<script>
/* ═══════════════════════════════════════════════════════════════
   DATA / STORAGE
   ═══════════════════════════════════════════════════════════════ */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const PRESETS = {
  'Clásico': ['Nombre','Apellido','Animal','Fruta o verdura','Color','País','Ciudad','Objeto','Marca','Comida o bebida','Película o serie','Profesión u oficio'],
  'Para chicos': ['Animal','Color','Fruta','Juguete','Personaje de dibujitos','Comida'],
  'Geografía': ['País','Ciudad','Río o lago','Montaña','Capital','Provincia o estado'],
  'Cultura pop': ['Película','Serie','Cantante o banda','Videojuego','Personaje ficticio','Canción'],
  'Picante': ['Insulto (sano)','Excusa para faltar al trabajo','Cosa que no le prestarías a nadie','Cosa que hacés en el baño','Sobrenombre','Cosa que se rompe fácil'],
};

const AVATAR_COLORS = ['#FF3E86','#FF9F1C','#FFD23F','#6BCB3D','#00CFC1','#9B5DE5','#F72585','#4CC9F0'];
const ALL_LETTERS = 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('');
const DEFAULT_LETTERS_OFF = ['K','W','X'];

function defaultSettings(){
  const letters = {}; ALL_LETTERS.forEach(l => letters[l] = !DEFAULT_LETTERS_OFF.includes(l));
  return { seconds: 90, scoreUnique: 100, scoreRepeated: 50, scoreEmpty: 0, letters };
}

const state = {
  screen: 'home',
  players: LS.get('ftf_players', []),
  decks: LS.get('ftf_decks', {}),
  settings: LS.get('ftf_settings', defaultSettings()),
  history: LS.get('ftf_history', []),
  match: LS.get('ftf_match_inprogress', null),
  setup: null,
  online: null,
};

function saveAll(){
  LS.set('ftf_players', state.players);
  LS.set('ftf_decks', state.decks);
  LS.set('ftf_settings', state.settings);
  LS.set('ftf_history', state.history);
}
function saveMatch(){ LS.set('ftf_match_inprogress', state.match); }
function clearMatch(){ state.match = null; localStorage.removeItem('ftf_match_inprogress'); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const MIN_WORD_LEN = 2;
const wordLookupCache = new Map();
function fetchWithTimeout(url, ms){
  return Promise.race([
    fetch(url),
    new Promise(resolve => setTimeout(()=>resolve(null), ms))
  ]).catch(()=>null);
}
async function lookupWord(word){
  const key = normalize(word);
  if(!key) return { checked:true, found:false, desc:null };
  if(wordLookupCache.has(key)) return wordLookupCache.get(key);
  let checked = false, found = false, desc = null;
  try{
    const r = await fetchWithTimeout('https://es.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(word.trim().replace(/\s+/g,'_')), 4000);
    if(r){
      checked = true;
      if(r.ok){
        const data = await r.json();
        if(data && data.extract && data.type !== 'disambiguation'){ found = true; desc = data.extract.split('\n')[0].slice(0,220); }
      }
    }
  }catch(e){}
  if(!found){
    try{
      const url = 'https://es.wiktionary.org/w/api.php?action=query&titles='+encodeURIComponent(word.trim())+'&prop=extracts&exintro=1&explaintext=1&format=json&origin=*&redirects=1';
      const r = await fetchWithTimeout(url, 4000);
      if(r){
        checked = true;
        if(r.ok){
          const data = await r.json();
          const pages = (data && data.query && data.query.pages) || {};
          const page = Object.values(pages)[0];
          if(page && page.pageid){
            found = true;
            const lines = (page.extract||'').split('\n').map(s=>s.trim()).filter(Boolean);
            desc = lines[0] ? lines[0].slice(0,220) : null;
          }
        }
      }
    }catch(e){}
  }
  const result = { checked, found, desc };
  wordLookupCache.set(key, result);
  return result;
}
async function computeResults(deck, players, letter){
  const results = {};
  const lookups = new Map();
  const toCheck = new Set();
  deck.forEach(cat => players.forEach(p => {
    const text = (p.answers||{})[cat] || '';
    if(text.trim().length>=MIN_WORD_LEN && startsWithLetter(text, letter)) toCheck.add(text.trim());
  }));
  await Promise.all([...toCheck].map(async w => { lookups.set(normalize(w), await lookupWord(w)); }));
  deck.forEach(cat => {
    const perPlayer = players.map(p => ({ id:p.id, text: (p.answers||{})[cat] || '' }));
    const counts = {};
    perPlayer.forEach(a => { const n = normalize(a.text); if(n) counts[n] = (counts[n]||0)+1; });
    perPlayer.forEach(a => {
      const n = normalize(a.text);
      let status, pts, desc=null;
      if(!n || a.text.trim().length<MIN_WORD_LEN){ status='bad'; pts=state.settings.scoreEmpty; }
      else if(!startsWithLetter(a.text, letter)){ status='bad'; pts=state.settings.scoreEmpty; }
      else {
        const lk = lookups.get(n) || { checked:false, found:false, desc:null };
        desc = lk.desc;
        if(lk.checked && !lk.found){ status='rev'; pts=state.settings.scoreEmpty; }
        else if(counts[n]>1){ status='rep'; pts=state.settings.scoreRepeated; }
        else { status='ok'; pts=state.settings.scoreUnique; }
      }
      if(!results[a.id]) results[a.id] = {};
      results[a.id][cat] = { text: a.text, status, points: pts, desc };
    });
  });
  return results;
}
function normalize(s){
  return String(s||'').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,' ');
}
function startsWithLetter(text, letter){
  const t = normalize(text); const l = normalize(letter);
  return t.length>0 && t.startsWith(l);
}

/* ═══════════════════════════════════════════════════════════════
   SOUND — beep generado, sin archivos externos
   ═══════════════════════════════════════════════════════════════ */
let audioCtx = null;
function beep(freq, dur, delay){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + (delay||0);
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.25, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur+0.05);
  }catch(e){}
}
function soundCountdown(){ beep(880,0.1,0); beep(880,0.1,0.35); beep(880,0.1,0.7); }
function soundEnd(){ beep(440,0.5,0); beep(660,0.6,0.15); }

function spinLetterBadge(el, finalLetter){
  if(!el) return;
  clearInterval(el._spinTimer);
  el.classList.remove('pop');
  let i = 0; const total = 10;
  el._spinTimer = setInterval(()=>{
    el.textContent = ALL_LETTERS[Math.floor(Math.random()*ALL_LETTERS.length)];
    i++;
    if(i>=total){
      clearInterval(el._spinTimer);
      el.textContent = finalLetter;
      el.classList.add('pop');
      beep(880,0.15,0);
      setTimeout(()=>el.classList.remove('pop'), 500);
    }
  }, 65);
}
function confettiBurst(n){

  setTimeout(()=>wrap.remove(), 2700);
}
/* ═══════════════════════════════════════════════════════════════

const TRIVIA_BANK = [
  {q:'¿Cuál es el río más largo del mundo?', opts:['Amazonas','Nilo','Mississippi','Yangtsé'], a:0},
  {q:'La Torre Eiffel está en Berlín.', opts:['Verdadero','Falso'], a:1},

function triviaPickQuestion(excludeQ){
  let q = excludeQ;
  if(TRIVIA_BANK.length>1) while(q===excludeQ) q = TRIVIA_BANK[Math.floor(Math.random()*TRIVIA_BANK.length)];
  else q = TRIVIA_BANK[0];
  return q;
}
function triviaState(){
  if(!state._trivia) state._trivia = { current: triviaPickQuestion(null), answered: null, streak: 0 };
  return state._trivia;
}
function triviaAnswer(i){
  const t = triviaState();
  if(t.answered!=null) return;
  t.answered = i;
  if(i===t.current.a){ t.streak++; beep(880,0.12,0); } else { t.streak = 0; beep(220,0.18,0); }
  render();
}
function triviaNext(){
  const t = triviaState();
  t.current = triviaPickQuestion(t.current);
  t.answered = null;
  render();
}
function renderTriviaWidget(){

      ${q.opts.map((opt,i)=>{
        let cls = 'btn trivia-opt';
        if(t.answered!=null){ if(i===q.a) cls+=' trivia-correct'; else if(i===t.answered) cls+=' trivia-wrong'; }
        return `<button class="${cls}" ${t.answered!=null?'disabled':''} onclick="triviaAnswer(${i})">${esc(opt)}</button>`;
      }).join('')}
    </div>
    ${t.answered!=null ? `<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="triviaNext()">Siguiente pregunta →</button>` : ''}
  </div>`;
}
function animateScoreCounts(container){
  (container||document).querySelectorAll('.pt[data-val]').forEach(el => {
    const to = +el.dataset.val || 0;
    const start = performance.now();
    const dur = 700;
    function step(t){
      const p = Math.min(1, (t-start)/dur);
      el.textContent = Math.round(to * (1-Math.pow(1-p,3)));
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

  const su = state.setup;

    .concat(su.newPlayers.map(name => {
      const p = { id: uid(), name, color: AVATAR_COLORS[state.players.length % AVATAR_COLORS.length], games:0, points:0, bestRound:0 };
      state.players.push(p); return p;
    }));
  if(players.length<2){ toast('Necesitás al menos 2 jugadores'); return; }
  saveAll();
  state.match = {
    mode: 'local', players: players.map(p=>({id:p.id, name:p.name, color:p.color})),
    deck: su.deck, usedLetters: [], roundNumber: 1, currentLetter: null,
    turnIndex: 0, roundAnswers: {}, scores: Object.fromEntries(players.map(p=>[p.id,0])),

function resumeMatch(){
  if(!state.match) return;
  const m = state.match;
  if(m.currentLetter && m._results){ state.screen = 'correctionLocal'; }
  else if(m.currentLetter){ state.screen = 'turnLocal'; }
  else { state.screen = 'roundScoreboard'; }
  document.getElementById('bottomnav').style.display='none';
  render();
}
function drawNextLetter(){
  const m = state.match;
  let pool = ALL_LETTERS.filter(l => state.settings.letters[l] && !m.usedLetters.includes(l));
  if(pool.length===0){ m.usedLetters = []; pool = ALL_LETTERS.filter(l => state.settings.letters[l]); }
  m.currentLetter = pool[Math.floor(Math.random()*pool.length)];
  m.usedLetters.push(m.currentLetter);
  m.turnIndex = 0; m.roundAnswers = {};
  saveMatch();
}
let turnTimer = null;

  state.screen = 'turnLocal'; render();

  const m = state.match; const player = m.players[m.turnIndex];

      </div>
      <button class="btn btn-primary btn-lg btn-block" style="margin-top:8px" onclick="submitTurn()">✅ Terminé / ¡Basta!</button>
    </div>`;
}
let turnSubmitted = false;
let turnCountdownPlayed = false;
function beginTurnTimer(){
  const secs = state.settings.seconds;
  turnSubmitted = false;
  spinLetterBadge(document.getElementById('letter-badge'), state.match.currentLetter);
  if(secs===0) return;
  turnCountdownPlayed = false;
  const endsAt = Date.now() + secs*1000;
  clearInterval(turnTimer);
  const tick = ()=>{
    const disp = document.getElementById('timer-display'); const bar = document.getElementById('timer-bar');
    if(!disp){ clearInterval(turnTimer); return; }
    const remaining = Math.max(0, Math.ceil((endsAt - Date.now())/1000));
    disp.textContent = remaining;
    bar.style.width = (remaining/secs*100)+'%';
    disp.classList.toggle('low', remaining<=10);
    if(remaining<=3 && remaining>0 && !turnCountdownPlayed){ turnCountdownPlayed = true; soundCountdown(); }
    if(remaining<=0){ clearInterval(turnTimer); soundEnd(); submitTurn(); }
  };
  turnTimer = setInterval(tick, 250);
  tick();
}
function submitTurn(){
  if(turnSubmitted) return;
  turnSubmitted = true;
  clearInterval(turnTimer);
  const m = state.match; const player = m.players[m.turnIndex];
  const answers = {};
  m.deck.forEach((c,i)=>{ const el = document.getElementById('ci-'+i); answers[c] = el ? el.value.trim() : ''; });
  m.roundAnswers[player.id] = answers;
  m.turnIndex++;
  saveMatch();
  if(m.turnIndex < m.players.length){ startTurn(); }
  else { enterCorrectionLocal(); }
}

function enterCorrectionLocal(){
  const m = state.match;
  state.screen = 'correctionLocal';
  m._results = null;
  render();
  const players = m.players.map(p => ({ id:p.id, answers: m.roundAnswers[p.id]||{} }));
  computeResults(m.deck, players, m.currentLetter).then(results => {
    if(state.match !== m) return;
    m._results = results; saveMatch();
    if(state.screen==='correctionLocal') render();
  });
}
const STATUS_LABEL = { ok:'Válida', rep:'Repetida', bad:'Inválida', rev:'¿Existe?' };
function renderCorrectionLocal(app){
  const m = state.match;
  if(!m._results){
    app.innerHTML = `${topbar('Corrigiendo respuestas', 'Buscando cada palabra en el diccionario...')}
      <div class="screen center" style="padding-top:60px"><div style="font-size:40px">📖</div></div>`;
    return;
  }
  const results = m._results;
  app.innerHTML = `
    ${topbar('Corrección — letra '+m.currentLetter, 'Tocá una respuesta para cambiar su estado')}
    <div class="screen">
      ${m.deck.map(cat => `
        <div class="correct-cat"><h4>${esc(cat)}</h4>
          ${m.players.map(p => {
            const r = (results[p.id]||{})[cat] || {text:'',status:'bad',points:state.settings.scoreEmpty,desc:null};
            return `<div class="ans-row">
              <span class="name">${esc(p.name)}</span>
              <span class="txt ${r.text?'':'empty'}">${r.text?esc(r.text):'(vacío)'}</span>
              <button class="status-btn ${r.status}" onclick="cycleStatus('${p.id}','${cat.replace(/'/g,"\\'")}')">${STATUS_LABEL[r.status]||r.status}</button>
              <span class="pts">${r.points}</span>
            </div>
            ${r.desc ? `<div class="ans-desc">${esc(r.desc)}</div>` : (r.status==='rev' ? `<div class="ans-desc">No la encontramos en el diccionario — revisala a mano.</div>` : '')}`;
          }).join('')}
        </div>`).join('')}
      <button class="btn btn-primary btn-lg btn-block" style="margin-top:16px" onclick="confirmRoundScore()">Confirmar puntaje de la ronda</button>
    </div>`;
}
function cycleStatus(playerId, cat){
  const results = state.screen==='onlineReview' ? state.online.reviewResults : state.match._results;
  const r = results[playerId][cat];
  const order = ['ok','rep','bad']; const next = order[(order.indexOf(r.status)+1)%order.length];
  r.status = next;
  r.points = next==='ok' ? state.settings.scoreUnique : next==='rep' ? state.settings.scoreRepeated : state.settings.scoreEmpty;
  render();
  if(state.screen==='onlineReview') broadcastReviewUpdate();
}
function confirmRoundScore(){
  const m = state.match; const results = m._results;
  m.players.forEach(p => {
    const total = Object.values(results[p.id]||{}).reduce((s,r)=>s+r.points,0);
    m.scores[p.id] = (m.scores[p.id]||0) + total;

  m.rounds.push({ letter: m.currentLetter, results });
  m.currentLetter = null; m._results = null;

function endLocalMatch(){

let peerLoaded = null;
function loadPeerJS(){
  if(peerLoaded) return peerLoaded;
  peerLoaded = new Promise((resolve,reject)=>{
    if(window.Peer) return resolve();
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error('no se pudo cargar PeerJS'));
    document.head.appendChild(s);
  });
  return peerLoaded;
}
function randCode(){ const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }

function hostCreateRoom(){
  const name = document.getElementById('oh-name').value.trim() || 'Anfitrión';
  toast('Conectando...');
  loadPeerJS().then(()=>{
    const code = randCode();
    const peer = new Peer('ftf-host-'+code);
    state.online = { role:'host', code, peer, name, conns: {}, guests: {}, deckName:'Clásico', deck:[...PRESETS['Clásico']],
      usedLetters: [], scores:{me:0}, myName:name, round:null, roundNum:0, history:[], awaitingAnswers:false,
      chatLog: [], chatOpen:false, chatUnread:0 };
    peer.on('open', ()=>{ nav('onlineLobbyHost'); showChatFab(); });
    peer.on('error', err => { console.error(err); toast('Error de conexión: '+err.type); });
    peer.on('connection', conn => {
      conn.on('open', ()=>{});
      conn.on('data', data => handleHostMessage(conn, data));
      conn.on('close', ()=>{
        if(!state.online) return;
        delete state.online.conns[conn.peer]; delete state.online.guests[conn.peer];
        maybeFinishRoundHost();
        if(state.screen==='onlineLobbyHost' || state.screen==='onlineWaiting') render();
      });
      state.online.conns[conn.peer] = conn;
    });
  }).catch(e=>toast('No se pudo cargar el modo online'));
}
function hostBroadcast(obj){
  Object.values(state.online.conns).forEach(c => { try{ c.send(obj); }catch(e){} });
}
let hostResendTimer = null;
function hostBroadcastPersistent(obj){
  const o = state.online;
  if(!o) return;
  o.lastCriticalBroadcast = obj;
  hostBroadcast(obj);
  clearInterval(hostResendTimer);
  const startedAt = Date.now();
  hostResendTimer = setInterval(()=>{
    const oo = state.online;
    if(!oo || oo.role!=='host' || oo.lastCriticalBroadcast!==obj || Date.now()-startedAt>30000){ clearInterval(hostResendTimer); return; }
    hostBroadcast(obj);
  }, 3000);
}
function hostCancelPersistentBroadcast(){
  if(state.online) state.online.lastCriticalBroadcast = null;
  clearInterval(hostResendTimer);
}
function handleHostMessage(conn, data){
  const o = state.online;
  if(data.type==='join'){
    o.guests[conn.peer] = { name: data.name || 'Jugador', answers:null };
    if(state.screen==='onlineLobbyHost') render();
  } else if(data.type==='answers'){
    if(o.awaitingAnswers && data.roundNum===o.roundNum && o.guests[conn.peer]){
      o.guests[conn.peer].answers = data.answers;
      maybeFinishRoundHost();
    }
  } else if(data.type==='basta'){
    if(o.round) hostStopRoundForAll(false);
  } else if(data.type==='chat'){
    addChatMessage(data);
    chatBroadcastRelay(conn, data);
  }
}

function hostStartRound(){
  const o = state.online;
  hostCancelPersistentBroadcast();
  let pool = ALL_LETTERS.filter(l => state.settings.letters[l] && !o.usedLetters.includes(l));
  if(pool.length===0){ o.usedLetters=[]; pool = ALL_LETTERS.filter(l=>state.settings.letters[l]); }
  const letter = pool[Math.floor(Math.random()*pool.length)];
  o.usedLetters.push(letter);
  o.roundNum++;
  Object.values(o.guests).forEach(g=>g.answers=null);
  o.myAnswers = null;
  o.awaitingAnswers = true;
  const secs = state.settings.seconds || 90;
  o.round = { letter, deck: o.deck, seconds: secs, roundNum: o.roundNum, localEndsAt: Date.now() + 1000 + secs*1000 };
  hostBroadcast({ type:'roundStart', letter, deck:o.deck, seconds:secs, roundNum:o.roundNum });
  state.screen = 'onlinePlaying'; render();

function maybeFinishRoundHost(){
  const o = state.online;
  if(!o.awaitingAnswers) return;
  const allIn = o.myAnswers && Object.values(o.guests).every(g=>g.answers);
  if(allIn){ o.awaitingAnswers = false; finishRoundHost(); return; }
  if(o.myAnswers && state.screen!=='onlineWaiting'){ state.screen='onlineWaiting'; render(); }
}
function finishRoundHost(){
  const o = state.online;
  const players = [{ id:'me', name:o.myName, answers:o.myAnswers }]
    .concat(Object.entries(o.guests).map(([pid,g])=>({ id:pid, name:g.name, answers:g.answers||{} })));
  o.lastPlayers = players;
  o.reviewResults = null;
  state.screen = 'onlineReview'; render();
  hostBroadcast({ type:'reviewStart', letter:o.round.letter, deck:o.round.deck, players: players.map(p=>({id:p.id,name:p.name})) });
  computeResults(o.round.deck, players, o.round.letter).then(results => {
    if(!state.online || state.online!==o) return;
    o.reviewResults = results;
    if(state.screen==='onlineReview') render();
    broadcastReviewUpdate();
  });
}

    players: o.lastPlayers.map(p=>({id:p.id,name:p.name})), results:o.reviewResults });
}

  const tick = ()=>{
    const msLeft = r.localEndsAt - Date.now();
    const secLeft = Math.max(0, Math.ceil(msLeft/1000));
    const disp = document.getElementById('timer-display'); if(!disp){ clearInterval(onlineTimer); return; }
    if(secLeft > r.seconds){ disp.textContent = '¡Ya sale!'; return; }
    disp.textContent = secLeft;
    document.getElementById('timer-bar').style.width = (secLeft/r.seconds*100)+'%';
    disp.classList.toggle('low', secLeft<=10);
    if(secLeft===3) soundCountdown();
    if(secLeft<=0){ clearInterval(onlineTimer); soundEnd(); submitOnlineAnswers(false); }
  };
  onlineTick = tick;
  onlineTimer = setInterval(tick, 250); tick();
}
let onlineSubmitted = false;
function submitOnlineAnswers(manual){
  if(!state.online.round || onlineSubmitted) return;
  onlineSubmitted = true;
  clearInterval(onlineTimer);
  const r = state.online.round;
  const answers = {};
  r.deck.forEach((c,i)=>{ const el = document.getElementById('oi-'+i); answers[c] = el ? el.value.trim() : ''; });
  const o = state.online;
  if(o.role==='host'){
    o.myAnswers = answers;
    maybeFinishRoundHost();
  } else {
    o.myAnswers = answers;
    try{ o.conn.send({ type:'answers', roundNum: r.roundNum, answers }); }catch(e){}
    state.screen = 'onlineWaiting'; render();
  }
}
function forceSubmitNow(){
  if(state.screen!=='onlinePlaying') return;
  submitOnlineAnswers(false);
}
function hostStopRoundForAll(calledByMe){
  hostBroadcast({ type:'roundStop' });
  if(!calledByMe) toast('¡Alguien cantó BASTA! Se cierra la ronda para todos.');
  forceSubmitNow();
}
function callBasta(){
  const o = state.online;
  if(!o || !o.round || onlineSubmitted) return;
  if(o.role==='host'){
    hostStopRoundForAll(true);
  } else {
    try{ o.conn.send({ type:'basta' }); }catch(e){}
    forceSubmitNow();
  }
}
let waitingHeartbeat = null;
function renderOnlineWaiting(app){
  const o = state.online;
  if(o.role!=='host'){
    app.innerHTML = `
      ${topbar('Esperando al resto')}
      <div class="screen center" style="padding-top:50px">
        <div style="font-size:44px;margin-bottom:12px">✅</div>
        <div class="sub">Ya mandaste tus respuestas. Esperando que terminen los demás...</div>
      </div>
      <div class="screen" style="padding-top:0">
        ${renderTriviaWidget()}
        <button class="btn btn-ghost btn-block" style="margin-top:14px" onclick="if(confirm('¿Salir de la sala? Vas a volver al inicio.'))guestLeaveRoom()">Salir de la sala</button>
      </div>`;
    clearInterval(waitingHeartbeat);
    waitingHeartbeat = setInterval(()=>{
      if(state.screen!=='onlineWaiting' || !state.online || state.online.role==='host'){ clearInterval(waitingHeartbeat); return; }
      const oo = state.online;
      try{ if(oo.conn && oo.conn.open && oo.myAnswers) oo.conn.send({ type:'answers', roundNum: oo.round ? oo.round.roundNum : undefined, answers: oo.myAnswers }); }catch(e){}
    }, 4000);
    return;
  }
  clearInterval(waitingHeartbeat);
  const guestEntries = Object.entries(o.guests);
  app.innerHTML = `
    ${topbar('Esperando al resto', 'Si alguien no contesta más, lo podés sacar')}
    <div class="screen">
      <div class="lobby-player"><span class="pulse" style="background:var(--ok);animation:none"></span><span class="grow">${esc(o.myName)} (vos) — listo</span></div>
      ${guestEntries.map(([pid,g])=>`<div class="lobby-player">
        <span class="pulse" style="${g.answers?'background:var(--ok);animation:none':'background:var(--warn)'}"></span>
        <span class="grow">${esc(g.name)}${g.answers?' — listo':' — esperando...'}</span>
        ${!g.answers?`<button class="btn btn-sm btn-danger" onclick="kickGuest('${pid}')">Sacar</button>`:''}
      </div>`).join('')}
    </div>`;
}
function renderOnlineScoreboard(app){
  const o = state.online;
  let players, scores, results;
  if(o.role==='host'){ players = o.lastPlayers; scores = o.scores; results = o.lastResults; }
  else { players = o.lastScoreboard.players; scores = o.lastScoreboard.scores; results = o.lastScoreboard.results; }
  const sorted = [...players].sort((a,b)=>(scores[b.id]||0)-(scores[a.id]||0));
  const cats = players.length && results[players[0].id] ? Object.keys(results[players[0].id]) : [];
  app.innerHTML = `
    ${topbar('Puntaje de la ronda')}
    <div class="screen">
      <div class="score-list">
        ${sorted.map((p,i)=>`<div class="score-item ${i===0?'first':''}"><span class="pos">${i+1}°</span><span class="nm">${esc(p.name)}</span><span class="pt" data-val="${scores[p.id]||0}">0</span></div>`).join('')}
      </div>
      <div class="card" style="margin-top:14px">
        <h3>Respuestas de la ronda</h3>
        ${cats.map(cat => `
          <div class="correct-cat"><h4>${esc(cat)}</h4>
            ${players.map(p => {
              const r = (results[p.id]||{})[cat] || {text:'',status:'bad',points:0,desc:null};
              return `<div class="ans-row">
                <span class="name">${esc(p.name)}</span>
                <span class="txt ${r.text?'':'empty'}">${r.text?esc(r.text):'(vacío)'}</span>
                <span class="status-btn ${r.status}">${STATUS_LABEL[r.status]||r.status}</span>
                <span class="pts">${r.points}</span>
              </div>
              ${r.desc ? `<div class="ans-desc">${esc(r.desc)}</div>` : ''}`;
            }).join('')}
          </div>`).join('')}
      </div>
      ${o.role==='host' ? `
      <div class="row" style="margin-top:18px">
        <button class="btn btn-danger grow" onclick="endOnlineMatch()">Terminar partida</button>
        <button class="btn btn-primary grow" onclick="hostStartRound()">Otra ronda</button>
      </div>` : `<div class="sub center" style="margin-top:16px">Esperando que el anfitrión siga jugando...</div>`}
    </div>`;
  animateScoreCounts(app);
}
function endOnlineMatch(){
  const o = state.online;
  hostCancelPersistentBroadcast();
  const record = { id: uid(), date: Date.now(), mode:'online', rounds: o.history,
    players: [{name:o.myName, points:o.scores.me||0}].concat(Object.entries(o.guests).map(([pid,g])=>({name:g.name, points:o.scores[pid]||0}))) };
  state.history.push(record); saveAll();
  hostBroadcast({ type:'matchEnd', players: record.players, roundsCount: o.roundNum });
  try{ o.peer.destroy(); }catch(e){}
  state.online = null;
  state.screen = 'matchEnd'; state._lastRecord = record; render();
  confettiBurst(40);
}

/* ═══════════════════════════════════════════════════════════════
   CHAT — texto, audio y emojis entre los participantes de una sala
   online. Viaja por los mismos DataConnection de PeerJS que ya usa
   el juego (sin backend propio). El anfitrión es el único que tiene
   conexión directa con cada invitado, así que retransmite los
   mensajes de un invitado al resto ("estrella" con relay). Vive
   fuera de #app a propósito: si usara render() se perdería lo que
   el jugador esté tipeando en las categorías en ese momento.
   ═══════════════════════════════════════════════════════════════ */
const CHAT_EMOJIS = ['😀','😂','😅','😍','😘','😜','🤔','😎','🥳','😱','😭','😡','🤯','🥶','🤢','😴',
  '👍','👎','👏','🙌','🙏','💪','🤝','✌️','🤙','👋','🍓','🍉','🍌','🎉','🔥','⭐',
  '❤️','💔','💯','⚡','🏆','🎲','⏱️','🤡','👻','💩','🐢','🦄','☕','🍕','⚽','🎮'];
function chatEnabled(){ return !!(state.online && state.online.peer); }
function chatMyName(){ const o = state.online; if(!o) return ''; return o.role==='host' ? o.myName : o.name; }
function chatMyId(){ const o = state.online; if(!o) return ''; return o.role==='host' ? 'me' : ((o.peer && o.peer.id) || 'me'); }
function showChatFab(){ document.getElementById('ftf-chat-fab').style.display = 'flex'; }
function hideChatFab(){
  document.getElementById('ftf-chat-fab').style.display = 'none';
  if(chatMediaRecorder) chatStopRecording(false);
  closeChatPanel();
}
function openChatPanel(){
  if(!chatEnabled()) return;
  const o = state.online;
  o.chatOpen = true; o.chatUnread = 0;
  updateChatBadge();
  document.getElementById('ftf-chat-sub').textContent = 'Sala '+o.code;
  document.getElementById('ftf-chat-panel').style.display = 'flex';
  renderChatMessages();
  setTimeout(()=>{ const el = document.getElementById('ftf-chat-text'); if(el) el.focus(); }, 50);
}
function closeChatPanel(){
  if(state.online) state.online.chatOpen = false;
  const panel = document.getElementById('ftf-chat-panel'); if(panel) panel.style.display = 'none';
  const em = document.getElementById('ftf-chat-emojis'); if(em) em.classList.remove('show');
}
function updateChatBadge(){
  const o = state.online; const badge = document.getElementById('ftf-chat-badge');
  if(!o || !o.chatUnread){ badge.style.display = 'none'; return; }
  badge.style.display = 'flex'; badge.textContent = o.chatUnread>9 ? '9+' : o.chatUnread;
}
function chatBubbleHTML(m){
  const mine = m.from === chatMyId();
  const time = new Date(m.ts).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  const body = m.kind==='audio'
    ? `<audio controls preload="none" src="${m.audio}"></audio>`
    : `<div>${esc(m.text)}</div>`;
  return `<div class="chat-row ${mine?'mine':''}"><div class="chat-bub">
    ${mine?'':`<div class="nm">${esc(m.fromName)}</div>`}
    ${body}
    <div class="ts">${time}</div>
  </div></div>`;
}
function renderChatMessages(){
  const wrap = document.getElementById('ftf-chat-msgs');
  const o = state.online;
  wrap.innerHTML = (o.chatLog||[]).map(chatBubbleHTML).join('');
  wrap.scrollTop = wrap.scrollHeight;
}
function appendChatBubble(m){
  const wrap = document.getElementById('ftf-chat-msgs');
  wrap.insertAdjacentHTML('beforeend', chatBubbleHTML(m));
  wrap.scrollTop = wrap.scrollHeight;
}
function addChatMessage(m){
  const o = state.online; if(!o) return;
  if(!o.chatLog) o.chatLog = [];
  if(o.chatLog.some(x=>x.id===m.id)) return;
  o.chatLog.push(m);
  if(o.chatOpen && document.getElementById('ftf-chat-panel').style.display!=='none'){
    appendChatBubble(m);
  } else {
    o.chatUnread = (o.chatUnread||0)+1;
    updateChatBadge();
    beep(1046,0.08,0);
    if(navigator.vibrate){ try{ navigator.vibrate(40); }catch(e){} }
  }
}
function chatBroadcastRelay(fromConn, msg){
  Object.values(state.online.conns).forEach(c => { if(c!==fromConn){ try{ c.send(msg); }catch(e){} } });
}
function chatDispatch(msg){
  const o = state.online;
  if(o.role==='host'){ hostBroadcast(msg); }
  else { try{ o.conn.send(msg); }catch(e){} }
}
function chatUpdateSendBtn(){
  const has = document.getElementById('ftf-chat-text').value.trim().length>0;
  document.getElementById('ftf-chat-mic-btn').style.display = has ? 'none' : 'flex';
  document.getElementById('ftf-chat-send-btn').style.display = has ? 'flex' : 'none';
}
function chatSendText(){
  if(!chatEnabled()) return;
  const inp = document.getElementById('ftf-chat-text');
  const text = inp.value.trim();
  if(!text) return;
  const msg = { type:'chat', id:uid(), kind:'text', from:chatMyId(), fromName:chatMyName(), text, ts:Date.now() };
  inp.value = ''; chatUpdateSendBtn();
  document.getElementById('ftf-chat-emojis').classList.remove('show');
  addChatMessage(msg);
  chatDispatch(msg);
}
function toggleEmojiPicker(){
  const el = document.getElementById('ftf-chat-emojis');
  if(!el.dataset.built){
    el.innerHTML = CHAT_EMOJIS.map(e=>`<button type="button" onclick="insertEmoji('${e}')">${e}</button>`).join('');
    el.dataset.built = '1';
  }
  el.classList.toggle('show');
}
function insertEmoji(e){
  const inp = document.getElementById('ftf-chat-text');
  inp.value += e; inp.focus(); chatUpdateSendBtn();
}

// -------- audio: grabar y mandar como nota de voz --------
let chatMediaRecorder = null, chatMediaChunks = [], chatRecStart = 0, chatRecTimer = null, chatRecStream = null;
function chatRecSupported(){ return !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
async function chatStartRecording(){
  if(!chatEnabled() || !chatRecSupported() || chatMediaRecorder) return;
  try{ chatRecStream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast('No se pudo acceder al micrófono'); return; }
  chatMediaChunks = [];
  try{ chatMediaRecorder = new MediaRecorder(chatRecStream); }
  catch(e){ toast('Grabar audio no está disponible en este navegador'); chatRecStream.getTracks().forEach(t=>t.stop()); chatRecStream=null; return; }
  chatMediaRecorder.ondataavailable = e => { if(e.data && e.data.size>0) chatMediaChunks.push(e.data); };
  chatMediaRecorder.onstop = chatFinishRecording;
  chatMediaRecorder.start();
  chatRecStart = Date.now();
  document.getElementById('ftf-chat-mic-btn').classList.add('rec','active');
  document.getElementById('ftf-chat-input-row').style.display = 'none';
  document.getElementById('ftf-chat-rec-indicator').style.display = 'flex';
  clearInterval(chatRecTimer);
  chatRecTimer = setInterval(()=>{
    const s = Math.floor((Date.now()-chatRecStart)/1000);
    document.getElementById('ftf-chat-rec-time').textContent = 'Grabando... '+s+'s';
    if(s>=60) chatStopRecording(true);
  }, 250);
}
function chatStopRecording(send){
  if(!chatMediaRecorder) return;
  chatMediaRecorder._send = send!==false;
  if(chatMediaRecorder.state!=='inactive') chatMediaRecorder.stop();
  clearInterval(chatRecTimer);
  const micBtn = document.getElementById('ftf-chat-mic-btn'); if(micBtn) micBtn.classList.remove('rec','active');
  const row = document.getElementById('ftf-chat-input-row'); if(row) row.style.display = 'flex';
  const ind = document.getElementById('ftf-chat-rec-indicator'); if(ind) ind.style.display = 'none';
}
function chatFinishRecording(){
  const dur = (Date.now()-chatRecStart)/1000;
  const send = chatMediaRecorder._send !== false;
  const mimeType = chatMediaRecorder.mimeType || 'audio/webm';
  if(chatRecStream){ chatRecStream.getTracks().forEach(t=>t.stop()); chatRecStream = null; }
  chatMediaRecorder = null;
  if(!send || dur<0.6 || chatMediaChunks.length===0){
    if(send && dur<0.6) toast('Grabación muy corta');
    chatMediaChunks = []; return;
  }
  const blob = new Blob(chatMediaChunks, {type:mimeType});
  chatMediaChunks = [];
  const reader = new FileReader();
  reader.onload = () => {
    if(!chatEnabled()) return;
    const msg = { type:'chat', id:uid(), kind:'audio', from:chatMyId(), fromName:chatMyName(), audio:reader.result, dur:Math.round(dur), ts:Date.now() };
    addChatMessage(msg);
    chatDispatch(msg);
  };
  reader.readAsDataURL(blob);
}
function initChatUI(){
  const micBtn = document.getElementById('ftf-chat-mic-btn');
  if(!chatRecSupported()){ micBtn.style.opacity = '.35'; micBtn.title = 'Audio no disponible en este navegador'; }
  const start = e => { e.preventDefault(); chatStartRecording(); };
  const stop = e => { e.preventDefault(); chatStopRecording(true); };
  const cancel = e => { e.preventDefault(); chatStopRecording(false); };
  micBtn.addEventListener('touchstart', start, {passive:false});
  micBtn.addEventListener('touchend', stop);
  micBtn.addEventListener('touchcancel', cancel);
  micBtn.addEventListener('mousedown', start);
  micBtn.addEventListener('mouseup', stop);
  micBtn.addEventListener('mouseleave', ()=>{ if(chatMediaRecorder) chatStopRecording(false); });
}

/* ═══════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════ */
function boot(){
  const params = new URLSearchParams(location.search);
  const joinCode = params.get('join');
  if(joinCode){
    document.getElementById('fg-splash').style.display = 'none';
    document.getElementById('fg-lock').style.display = 'none';
    document.getElementById('bottomnav').style.display = 'none';
    state._joinCode = joinCode.toUpperCase();
    state.screen = 'onlineJoin';
  }
  render();
  initChatUI();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}
boot();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════
   IDENTIDAD FRIGURSO — traba de privacidad simple, independiente del
   resto de la app. No cifra datos, solo tapa la vista hasta que se
   pone la contraseña. El desbloqueo es una acción del usuario, no
   un timer, así que si esto tarda en cargar el peor caso es que el
   botón no responda todavía — nunca queda trabado en silencio.
   ═══════════════════════════════════════════════════════════════ */
function fgErr(id, msg){ const el = document.getElementById(id); el.textContent = msg; el.style.display = 'block'; }
function fgHideErr(id){ document.getElementById(id).style.display = 'none'; }
async function _hashPass(pass){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pass));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function fgOcultarLock(){
  document.getElementById('fg-lock').style.display = 'none';
  try{ localStorage.setItem('ftf_unlocked','1'); }catch(e){}
}
function fgMostrarLock(){
  try{ localStorage.removeItem('ftf_unlocked'); }catch(e){}
  document.getElementById('lk-pass-in').value = '';
  fgHideErr('lk-ing-err');
  document.getElementById('fg-lock').style.display = 'flex';
}
async function fgCrearAcceso(){
  fgHideErr('lk-crear-err');
  const p1 = document.getElementById('lk-pass').value;
  const p2 = document.getElementById('lk-pass2').value;
  if(!p1 || p1.length<4){ fgErr('lk-crear-err','Mínimo 4 caracteres'); return; }
  if(p1!==p2){ fgErr('lk-crear-err','Las contraseñas no coinciden'); return; }
  localStorage.setItem('ftf_pass_hash', await _hashPass(p1));
  fgOcultarLock();
}
async function fgIngresarAcceso(){
  fgHideErr('lk-ing-err');
  const p = document.getElementById('lk-pass-in').value;
  if((await _hashPass(p)) === localStorage.getItem('ftf_pass_hash')){
    fgOcultarLock();
  } else {
    fgErr('lk-ing-err','Contraseña incorrecta');
  }
}
function fgOlvideAcceso(){
  if(!confirm('Vamos a borrar la contraseña de este celular para que puedas entrar de nuevo. Tus datos NO se borran.\n\n¿Continuar?')) return;
  localStorage.removeItem('ftf_pass_hash');
  location.reload();
}
if(new URLSearchParams(location.search).get('join')){
  // Invitado entrando por link de sala: no es Fernando, no pedimos su contraseña.
} else if(localStorage.getItem('ftf_pass_hash')){
  document.getElementById('lk-crear').style.display = 'none';
  document.getElementById('lk-ingresar').style.display = 'block';
  let yaDesbloqueado = false;
  try{ yaDesbloqueado = localStorage.getItem('ftf_unlocked') === '1'; }catch(e){}
  if(yaDesbloqueado) fgOcultarLock();
}
</script>
